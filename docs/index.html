      var going = out.map(function (p) { return p.id; });
      var left = active(state).filter(function (p) { return p.hand.length > 0; });
      // everyone still in went out together: the lowest card among them loses
      var loser = left.length === 1 ? left[0].id : !left.length ? going.pop() : null;
      going.forEach(function (pid) { state.out.push(pid); });
      if (going.length) emit(state, now, { type: 'out', players: going, places: going.map(function (pid) { return state.out.indexOf(pid) + 1; }) });
      if (loser) {
        state.setResult = best;
        emit(state, now, { type: 'setWon', player: best ? best.player : null, card: best ? best.card : null });
        lose(state, now, loser);
        return;
      }
      out = [];
    }

    if (out.length) {
      state.setResult = best;
      state.phase = 'over';
      state.winners = [out[0].id];
      state.winReason = 'empty';
      emit(state, now, { type: 'setWon', player: best ? best.player : null, card: best ? best.card : null });
      emit(state, now, {
        type: 'gameOver', reason: 'empty', winners: state.winners,
        out: out.map(function (p) { return p.id; }),
        hands: handsOf(state)
      });
      return;
    }

    if (!best) {
      // Nobody holds a card in the set (only possible in freak deck-empty cases).
      var keep = state.leader && !isOut(state, state.leader) ? state.leader : CT.pickRandom(active(state), state).id;
      best = { player: keep, card: null };
    }
    state.setResult = best;
    // a set winner who went out can't lead: the next player still in does
    state.leadFrom = isOut(state, best.player) ? best.player : null;
    state.nextLeader = state.leadFrom ? nextActive(state, best.player) : best.player;
    state.phase = 'reveal';
    state.phaseEndsAt = now + revealHold(state);
    emit(state, now, { type: 'setWon', player: best.player, card: best.card, next: state.nextLeader });
  }

  /* ---------- Real Burns: the loser and the penalty round ----------------- */

  /* One player is left holding cards. The last set stays on the table a
     moment, then the penalty round begins. */
  function lose(state, now, pid) {
    state.loser = pid;
    state.phase = 'lost';
    state.turnEndsAt = null;
    state.phaseEndsAt = now + state.timing.lostHoldMs;
    emit(state, now, { type: 'loser', player: pid, out: state.out.slice() });
  }

  /* Every winner takes a turn, clockwise from the loser's left. */
  function startPenalty(state, now) {
    var ps = state.players, at = 0, order = [];
    for (var i = 0; i < ps.length; i++) if (ps[i].id === state.loser) at = i;
    for (var k = 1; k < ps.length; k++) order.push(ps[(at + k) % ps.length].id);
    state.phase = 'penalty';
    state.penalty = {
      order: order, turn: -1, step: null, shuffler: null,
      stopFrom: null, endsAt: null, nextAt: null,
      suit: null, deck: null, drawn: [], soft: 0, hard: 0, lucky: false,
      results: []
    };
    emit(state, now, { type: 'penaltyStart', loser: state.loser, order: order.slice() });
    nextTurn(state, now);
  }

  function nextTurn(state, now) {
    var P = state.penalty;
    P.turn += 1;
    if (P.turn >= P.order.length) { finishPenalty(state, now); return; }
    P.shuffler = P.order[P.turn];
    P.step = 'shuffle';
    P.suit = null; P.deck = null; P.drawn = []; P.soft = 0; P.hard = 0; P.lucky = false; P.nextAt = null;
    P.stopFrom = now + state.timing.stopFromMs;
    P.endsAt = now + state.timing.shuffleMs;
    emit(state, now, { type: 'penaltyTurn', shuffler: P.shuffler, turn: P.turn, of: P.order.length });
  }

  /* "Stop!": the deck is as it lies when the shuffling stops. */
  function stopShuffle(state, now, auto) {
    var P = state.penalty;
    P.deck = CT.shuffle(CT.standardDeck(), state);
    P.step = 'suit';
    P.stopFrom = null;
    P.endsAt = now + state.timing.suitMs;
    emit(state, now, { type: 'penaltyStop', player: state.loser, shuffler: P.shuffler, auto: !!auto });
  }

  function pickSuit(state, now, suit, auto) {
    var P = state.penalty;
    P.suit = suit;
    P.step = 'draw';
    P.endsAt = null;
    P.nextAt = now + state.timing.flipMs;
    emit(state, now, { type: 'penaltySuit', player: state.loser, shuffler: P.shuffler, suit: suit, auto: !!auto });
  }

  /* Turn over the next card. Until the loser's suit turns up, each one is a
     slap: soft for black, hard for red. The card of the suit doesn't count. */
  function flipCard(state, now) {
    var P = state.penalty;
    var card = P.deck.pop();
    P.drawn.push(card);
    var match = card.suit === P.suit;
    if (!match) { if (CT.SUIT_INFO[card.suit].color === 'red') P.hard++; else P.soft++; }
    emit(state, now, { type: 'penaltyCard', shuffler: P.shuffler, card: card, n: P.drawn.length, match: match, soft: P.soft, hard: P.hard });
    if (!match) { P.nextAt = now + (P.drawn.length < 4 ? state.timing.flipMs : state.timing.fastFlipMs); return; }
    P.lucky = P.drawn.length === 1;
    P.step = 'result';
    P.nextAt = null;
    P.endsAt = now + state.timing.slapMs;
    P.results.push({ by: P.shuffler, suit: P.suit, cards: P.drawn.slice(), soft: P.soft, hard: P.hard, lucky: P.lucky });
    emit(state, now, { type: 'penaltyResult', shuffler: P.shuffler, loser: state.loser, suit: P.suit, soft: P.soft, hard: P.hard, lucky: P.lucky, n: P.drawn.length });
  }

  function slapTotals(state) {
    var t = { soft: 0, hard: 0 };
    (state.penalty ? state.penalty.results : []).forEach(function (r) { t.soft += r.soft; t.hard += r.hard; });
    return t;
  }

  /* Everyone but the loser wins. */
  function finishPenalty(state, now) {
    var P = state.penalty;
    P.step = 'done';
    P.shuffler = null;
    P.endsAt = null;
    state.phase = 'over';
    state.winners = state.out.slice();
    state.winReason = 'real';
    var t = slapTotals(state);
    emit(state, now, { type: 'gameOver', reason: 'real', winners: state.winners.slice(), loser: state.loser, soft: t.soft, hard: t.hard, hands: handsOf(state) });
  }

  function handsOf(state) {
    var hands = {};
    state.players.forEach(function (p) { hands[p.id] = p.hand.slice(); });
    return hands;
  }

  /* ---------- moves shared by actions and time-outs ---------------------- */

  function lead(state, p, card, now, auto) {
    p.hand.splice(p.hand.indexOf(card), 1);
    state.table.push({ card: card, owner: p.id, via: 'lead', auto: !!auto });
    state.committed[p.id] = true;
    state.suit = card.suit;
    state.phase = 'follow';
    var faceUp = state.options.leadCard === 'faceUp';
    emit(state, now, { type: 'lead', player: p.id, suit: card.suit, card: faceUp ? card : null, auto: !!auto }, secretFor(p.id, { card: card }));
    beginFollow(state, now);
  }

  function commit(state, p, card, now, auto) {
    p.hand.splice(p.hand.indexOf(card), 1);
    state.table.push({ card: card, owner: p.id, via: 'hand', auto: !!auto });
    state.committed[p.id] = true;
    emit(state, now, { type: 'commit', player: p.id, auto: !!auto }, secretFor(p.id, { card: card }));
  }

  /* Draws go into the hand. Players see their own card; everyone else only
     sees that a card was drawn. */
  function drawOne(state, p, now, auto) {
    var card = state.deck.pop();
    var n = (state.drawn[p.id] || 0) + 1;
    state.drawn[p.id] = n;
    p.hand.push(card);
    var matched = card.suit === state.suit;
    emit(state, now, { type: 'draw', player: p.id, n: n, deckLeft: state.deck.length, auto: !!auto }, secretFor(p.id, { card: card, matched: matched }));
    if (!state.deck.length) {
      emit(state, now, { type: 'deckEmpty' });
      markStuck(state, now);
    }
    return card;
  }

  /* ---------- actions ---------------------------------------------------- */

  function actLead(state, pid, payload, now) {
    if (state.phase !== 'lead') return CT.fail('not-now', 'Wait for the next set to start.');
    if (pid !== state.leader) return CT.fail('not-leader', 'Only the winner of the last set leads.');
    var p = player(state, pid);
    var card = p.hand.filter(function (c) { return c.id === payload.cardId; })[0];
    if (!card) return CT.fail('no-card', 'That card is not in your hand.');
    lead(state, p, card, now, false);
    return CT.ok();
  }

  function followGuard(state, pid) {
    if (state.phase !== 'follow') return CT.fail('not-now', 'Wait for the suit to be set.');
    if (pid === state.leader) return CT.fail('leader', 'You already led this set.');
    if (!player(state, pid)) return CT.fail('no-player', 'You are not in this game.');
    if (isOut(state, pid)) return CT.fail('out', 'You’re out: you emptied your hand.');
    if (state.committed[pid]) return CT.fail('done', 'Your card for this set is already in.');
    if (isTaker(state, pid)) return CT.fail('stuck', 'The deck is empty. You will take a card from the set once everyone has played.');
    return null;
  }

  function actFollow(state, pid, payload, now) {
    var bad = followGuard(state, pid);
    if (bad) return bad;
    var p = player(state, pid);
    var card = p.hand.filter(function (c) { return c.id === payload.cardId; })[0];
    if (!card) return CT.fail('no-card', 'That card is not in your hand.');
    if (card.suit !== state.suit) return CT.fail('wrong-suit', 'You must play a ' + suitName(state.suit) + '.');
    commit(state, p, card, now, false);
    checkFollowComplete(state, now);
    return CT.ok();
  }

  /* Any follower may draw while the deck lasts, hoping for a better card of
     the suit; players without the suit must draw until one turns up. Every
     drawn card stays in the hand. */
  function actDraw(state, pid, payload, now) {
    var bad = followGuard(state, pid);
    if (bad) return bad;
    var p = player(state, pid);
    if (!state.deck.length) return CT.fail('deck-empty', 'The deck is empty.');
    var last = state.lastDrawAt[pid];
    var gap = state.timing.drawCooldownMs;
    if (last != null && now - last < gap) {
      return CT.fail('cooldown', 'Drawing too fast.', { retryInMs: Math.ceil(gap - (now - last)) });
    }
    state.lastDrawAt[pid] = now;
    var card = drawOne(state, p, now, false);
    checkFollowComplete(state, now);
    return CT.ok({ card: card, matched: card.suit === state.suit });
  }

  function actTake(state, pid, payload, now) {
    if (state.phase !== 'take') return CT.fail('not-now', 'Cards can only be taken when the deck is empty.');
    if (!isTaker(state, pid)) return CT.fail('not-taker', 'Only players who could not follow take a card.');
    if (state.taken[pid]) return CT.fail('done', 'You already took a card.');
    var entry = null;
    for (var i = 0; i < state.table.length; i++) if (state.table[i].card.id === payload.cardId) entry = state.table[i];
    if (!entry) return CT.fail('no-card', 'That card is not in this set.');
    if (entry.takenBy) {
      var who = player(state, entry.takenBy);
      return CT.fail('taken', (who ? who.name : 'Someone') + ' already took that card.');
    }
    applyTake(state, pid, entry, now, false);
    maybeFinishTake(state, now);
    return CT.ok();
  }

  /* ---------- Real Burns: the penalty round's moves ---------------------- */

  function penaltyStep(state, step) {
    return state.phase === 'penalty' && state.penalty && state.penalty.step === step;
  }
  function loserName(state) { var p = player(state, state.loser); return p ? p.name : 'The loser'; }

  /* The loser calls Stop while a winner shuffles. */
  function actStop(state, pid, payload, now) {
    if (!penaltyStep(state, 'shuffle')) return CT.fail('not-now', 'Nobody is shuffling right now.');
    if (pid !== state.loser) return CT.fail('not-loser', loserName(state) + ' calls Stop, not you.');
    var P = state.penalty;
    if (now < P.stopFrom) return CT.fail('wait', 'Let them shuffle for a moment first.', { retryInMs: Math.ceil(P.stopFrom - now) });
    stopShuffle(state, now, false);
    return CT.ok();
  }

  /* …then names a suit. */
  function actSuit(state, pid, payload, now) {
    if (!penaltyStep(state, 'suit')) return CT.fail('not-now', 'It isn’t time to pick a suit.');
    if (pid !== state.loser) return CT.fail('not-loser', loserName(state) + ' picks the suit, not you.');
    if (CT.SUITS.indexOf(payload.suit) < 0) return CT.fail('bad-suit', 'Pick Hearts, Spades, Diamonds or Clubs.');
    pickSuit(state, now, payload.suit, false);
    return CT.ok();
  }

  /* The winner has had their moment: on to the next winner. */
  function actNext(state, pid, payload, now) {
    if (!penaltyStep(state, 'result')) return CT.fail('not-now', 'Not yet.');
    var P = state.penalty;
    if (pid !== P.shuffler) {
      var s = player(state, P.shuffler);
      return CT.fail('not-yours', 'Waiting for ' + (s ? s.name : 'the shuffler') + '.');
    }
    nextTurn(state, now);
    return CT.ok();
  }

  var ACTIONS = { lead: actLead, follow: actFollow, draw: actDraw, take: actTake, stop: actStop, suit: actSuit, next: actNext };

  function act(state, pid, type, payload, now) {
    if (state.phase === 'over') return CT.fail('over', 'This game is over.');
    var fn = ACTIONS[type];
    if (!fn) return CT.fail('unknown', 'Unknown action: ' + type);
    return fn(state, pid, payload || {}, now);
  }

  /* ---------- timed steps ------------------------------------------------ */

  /* Time ran out: finish the turn for anyone still deciding. A random card is
     played for them; if they have none of the suit, they draw until one turns
     up and it is played (or, if the deck runs out, they take from the set). */
  function timeOut(state, now) {
    if (state.phase === 'lead') {
      var leader = player(state, state.leader);
      emit(state, now, { type: 'timeout', phase: 'lead', players: [leader.id] });
      lead(state, leader, CT.pickRandom(leader.hand, state), now, true);
      return;
    }
    var late = pending(state);
    emit(state, now, { type: 'timeout', phase: 'follow', players: late.map(function (p) { return p.id; }) });
    late.forEach(function (p) {
      if (state.committed[p.id] || isTaker(state, p.id)) return;
      var suited = p.hand.filter(function (c) { return c.suit === state.suit; });
      if (suited.length) { commit(state, p, CT.pickRandom(suited, state), now, true); return; }
      while (state.deck.length && !isTaker(state, p.id)) {
        var card = drawOne(state, p, now, true);
        if (card.suit === state.suit) { commit(state, p, card, now, true); return; }
      }
    });
    checkFollowComplete(state, now);
    if (state.phase === 'follow' && pending(state).length) state.turnEndsAt = now + 1000;  // safety net
  }

  function tick(state, now) {
    if (state.phase === 'dealing' && now >= state.phaseEndsAt) {
      var flush = !flushOn(state) ? [] : state.players.filter(function (p) {
        return CT.SUITS.every(function (s) { return CT.hasSuit(p.hand, s); });
      });
      if (flush.length && realOn(state)) {
        // Real Burns: a Flush is safe straight away, and the rest play on.
        var safe = flush.map(function (p) { return p.id; });
        var shown = {};   // only the Flush hands are shown: everyone else plays on
        flush.forEach(function (p) { shown[p.id] = p.hand.slice(); });
        emit(state, now, { type: 'flush', players: safe, hands: shown });
        flush.forEach(function (p) {
          p.hand.forEach(function (c) { state.discard.push(c); });
          p.hand = [];
          state.out.push(p.id);
        });
        emit(state, now, { type: 'out', players: safe, places: safe.map(function (pid) { return state.out.indexOf(pid) + 1; }), flush: true });
        var left = active(state);
        if (left.length >= 2) startSet(state, now, null);
        else if (left.length === 1) {
          state.discard.push(state.starter);
          state.starter = null;
          lose(state, now, left[0].id);
        } else {
          // everyone held a Flush: nobody loses
          state.phase = 'over';
          state.winners = safe;
          state.winReason = 'flush';
          emit(state, now, { type: 'gameOver', reason: 'flush', winners: safe, hands: handsOf(state) });
        }
      } else if (flush.length) {
        state.phase = 'over';
        state.winners = flush.map(function (p) { return p.id; });
        state.winReason = 'flush';
        emit(state, now, { type: 'flush', players: state.winners, hands: handsOf(state) });
        emit(state, now, { type: 'gameOver', reason: 'flush', winners: state.winners, hands: handsOf(state) });
      } else {
        if (flushOn(state)) emit(state, now, { type: 'noFlush' });
        startSet(state, now, null);
      }
      return true;
    }

    if ((state.phase === 'lead' || state.phase === 'follow') && state.turnEndsAt != null && now >= state.turnEndsAt) {
      timeOut(state, now);
      return true;
    }

    if (state.phase === 'take' && now >= state.takeEndsAt) {
      // Anyone who didn't choose gets a random card, in random order, while cards last.
      var waiting = CT.shuffle(state.takers.filter(function (pid) { return !state.taken[pid]; }), state);
      waiting.forEach(function (pid) {
        var left = cardsOnTable(state);
        if (left.length) applyTake(state, pid, CT.pickRandom(left, state), now, true);
      });
      finishSet(state, now);
      return true;
    }

    if (state.phase === 'reveal' && now >= state.phaseEndsAt) {
      startSet(state, now, state.nextLeader || state.setResult.player);
      return true;
    }

    if (state.phase === 'lost' && now >= state.phaseEndsAt) {
      startPenalty(state, now);
      return true;
    }

    if (state.phase === 'penalty') {
      var P = state.penalty;
      if (P.step === 'shuffle' && now >= P.endsAt) { stopShuffle(state, now, true); return true; }
      if (P.step === 'suit' && now >= P.endsAt) { pickSuit(state, now, CT.pickRandom(CT.SUITS, state), true); return true; }
      if (P.step === 'draw' && now >= P.nextAt) { flipCard(state, now); return true; }
      if (P.step === 'result' && now >= P.endsAt) { nextTurn(state, now); return true; }
    }
    return false;
  }

  /* ---------- what one player may see ------------------------------------ */

  function view(state, pid, opts) {
    opts = opts || {};
    var me = player(state, pid);
    var over = state.phase === 'over';
    var faceUpLead = state.options.leadCard === 'faceUp';
    var hand = me ? me.hand.slice() : [];

    function visible(e) {
      return state.revealed || over || e.owner === pid || e.via === 'starter' || (e.via === 'lead' && faceUpLead);
    }

    var v = {
      mode: 'burns',
      engineVersion: state.engineVersion,
      me: pid,
      phase: state.phase,
      setNo: state.setNo,
      leader: state.leader,
      suit: state.suit,
      options: state.options,
      flushRule: flushOn(state),
      timing: { drawCooldownMs: state.timing.drawCooldownMs, takeWindowMs: state.timing.takeWindowMs, turnMs: turnMs(state) },
      phaseEndsAt: state.phaseEndsAt,
      turnEndsAt: state.turnEndsAt,
      takeEndsAt: state.takeEndsAt,
      revealed: state.revealed,
      deckCount: state.deck.length,
      discard: state.discard.slice(),
      starter: state.starter,   // face up during the deal; joins the table in set 1
      hand: hand,
      players: state.players.map(function (p) {
        return {
          id: p.id,
          name: p.name,
          isBot: p.isBot,
          seat: p.seat,
          handCount: p.hand.length,
          isLeader: p.id === state.leader,
          committed: !!state.committed[p.id],
          drew: state.drawn[p.id] || 0,
          isTaker: isTaker(state, p.id),
          took: state.taken[p.id] || null,
          out: isOut(state, p.id),
          place: isOut(state, p.id) ? state.out.indexOf(p.id) + 1 : null,
          hand: over ? p.hand.slice() : undefined
        };
      }),
      table: state.table.map(function (e) {
        return { owner: e.owner, via: e.via, auto: !!e.auto, takenBy: e.takenBy || null, gone: !!e.gone, card: visible(e) ? e.card : null };
      }),
      setResult: state.setResult,
      winners: state.winners,
      winReason: state.winReason,
      lastDrawAt: state.lastDrawAt[pid] != null ? state.lastDrawAt[pid] : null,
      real: realOn(state),
      out: (state.out || []).slice(),
      leadFrom: state.leadFrom || null,
      nextLeader: state.phase === 'reveal' ? state.nextLeader || null : null,
      loser: state.loser || null,
      penalty: null,
      seq: state.seq
    };

    // the penalty round: everything but the order of the deck still to be turned over
    var P = state.penalty;
    if (P) {
      v.penalty = {
        order: P.order.slice(), turn: P.turn, step: P.step, shuffler: P.shuffler,
        stopFrom: P.stopFrom, endsAt: P.endsAt, suit: P.suit,
        drawn: P.drawn.slice(), soft: P.soft, hard: P.hard, lucky: P.lucky,
        results: P.results.map(function (r) { return { by: r.by, suit: r.suit, cards: r.cards.slice(), soft: r.soft, hard: r.hard, lucky: r.lucky }; }),
        timing: { stopFromMs: state.timing.stopFromMs, shuffleMs: state.timing.shuffleMs, suitMs: state.timing.suitMs, slapMs: state.timing.slapMs }
      };
    }
    v.canStop = !!me && penaltyStep(state, 'shuffle') && pid === state.loser;
    v.canSuit = !!me && penaltyStep(state, 'suit') && pid === state.loser;
    v.canNext = !!me && penaltyStep(state, 'result') && pid === P.shuffler;

    // still owes a card this set (Real Burns: players who are out and safe owe nothing)
    var mine = me && state.phase === 'follow' && pid !== state.leader && !isOut(state, pid) && !state.committed[pid] && !isTaker(state, pid);
    var hasIt = !!mine && CT.hasSuit(hand, state.suit);
    v.canLead = !!me && state.phase === 'lead' && state.leader === pid;
    v.canFollow = hasIt;
    v.canDraw = !!mine && state.deck.length > 0;
    v.mustDraw = v.canDraw && !hasIt;
    v.mayDraw = v.canDraw && hasIt;   // holds the suit: play it, or draw for a better one
    v.canTake = !!me && state.phase === 'take' && isTaker(state, pid) && !state.taken[pid];
    v.playable = v.canLead ? hand.map(function (c) { return c.id; })
      : v.canFollow ? hand.filter(function (c) { return c.suit === state.suit; }).map(function (c) { return c.id; })
      : [];

    if (opts.events !== false) {
      var since = opts.sinceSeq || 0;
      v.events = state.events.filter(function (e) { return e.seq > since; }).map(function (e) {
        var copy = {};
        for (var k in e) if (k !== 'secret') copy[k] = e[k];
        if (e.secret && e.secret[pid]) copy.mine = e.secret[pid];
        return copy;
      });
    }
    return v;
  }

  /* ---------- rules text for How to play ---------------------------------- */

  function rules(options) {
    var o = CT.resolveOptions(OPTIONS, options);
    var leadText = o.leadCard === 'suitOnly'
      ? 'Everyone sees the suit that was led; the card itself stays hidden until the reveal.'
      : 'The lead card is shown to everyone straight away.';
    var secs = Number(o.turnTime) || 30;
    var flushText = o.flush === 'on'
      ? 'If your 4 starting cards include all four suits, you have a Flush and win before play begins. If more than one player has a Flush, they share the win.'

      choices: [
        { value: 'secret', label: 'Stay secret', help: 'If nobody calls Bull on a bluff, nobody ever finds out what was really played.' },
        { value: 'shown', label: 'Revealed', help: 'If a bluff gets past everyone, its cards are turned over for all to see as soon as it’s too late to call Bull.' }
      ]
    },
    {
      id: 'bots',
      label: 'Computer players',
      default: 'normal',
      choices: [
        { value: 'easy', label: 'Trusting', help: 'The computer players rarely call Bull and bluff in obvious ways.' },
        { value: 'normal', label: 'Normal', help: 'The computer players call Bull when a claim looks unlikely, and bluff now and then.' },
        { value: 'sharp', label: 'Suspicious', help: 'The computer players call Bull more often and sneak in extra cards when they can.' }
      ]
    }
  ];

  /* ---------- helpers ---------------------------------------------------- */

  function player(state, pid) {
    for (var i = 0; i < state.players.length; i++) if (state.players[i].id === pid) return state.players[i];
    return null;
  }

  /* The next seat clockwise. */
  function nextAfter(state, pid) {
    var ps = state.players;
    for (var i = 0; i < ps.length; i++) if (ps[i].id === pid) return ps[(i + 1) % ps.length].id;
    return null;
  }

  function turnMs(state) {
    if (state.timing.turnMs != null) return state.timing.turnMs;    // tests and lessons
    return (Number(state.options.turnTime) || 30) * 1000;
  }
  function bullMs(state) {
    if (state.timing.bullMs != null) return state.timing.bullMs;
    return (Number(state.options.bullTime) || 3) * 1000;
  }
  function turnDeadline(state, from) { var ms = turnMs(state); return ms ? from + ms : null; }

  function pileCount(state) {
    var n = 0;
    state.pile.forEach(function (pl) { n += pl.cards.length; });

    state.players.forEach(function (p) { out[p.id] = p.hand.length; });

  function emit(state, now, ev, secret) {

    if (state.events.length > 400) state.events.splice(0, state.events.length - 400);

  /* ---------- setup ------------------------------------------------------ */

  function createGame(config) {
    var players = config.players || [];

    var now = config.now || 0;
    var timing = {};
    for (var k in DEFAULT_TIMING) timing[k] = DEFAULT_TIMING[k];
    if (config.timing) for (var t in config.timing) timing[t] = config.timing[t];

    var state = {
      mode: 'bull',
      engineVersion: ENGINE_VERSION,
      rng: ((config.seed != null ? config.seed : Date.now()) >>> 0) || 1,
      options: CT.resolveOptions(OPTIONS, config.options),
      timing: timing,
      players: players.map(function (p, i) {

      }),
      phase: 'dealing',
      phaseEndsAt: now + timing.dealHoldMs,
      starter: null,
      turn: null,         // whose turn it is to play
      turnEndsAt: null,   // when time runs out for them
      openAt: null,       // they may play from here (everyone's had a moment to call Bull)
      rank: 0,            // the rank they must claim: an index into RANKS
      pile: [],           // face-down plays since the pile was last picked up: { by, rank, cards, no, exposed? }
      last: null,         // the play that can be called: { by, rank, n, at, no }
      plays: 0,
      reveal: null,       // a call being shown: { challenger, accused, rank, n, cards, lie, taker, count, wasLast, no }
      exposure: null,     // the latest bluff turned over because nobody called it (rule choice)
      winners: null,
      seq: 0,
      events: []

    deck.forEach(function (c, i) { state.players[(start + i) % state.players.length].hand.push(c); });

    state.players.forEach(function (p) { secret[p.id] = { hand: p.hand.slice() }; });
    var order = [];
    for (var i = 0; i < state.players.length; i++) order.push(state.players[(start + i) % state.players.length].id);

      options: state.options,
      timing: { turnMs: turnMs(state), bullMs: bullMs(state), revealMs: state.timing.revealMs, lastCallMs: bullMs(state) + state.timing.lastCallExtraMs },
      phaseEndsAt: state.phaseEndsAt,
      starter: state.starter,
      turn: state.turn,
      turnEndsAt: state.turnEndsAt,
      openAt: state.openAt,
      rank: RANKS[state.rank],
      rankIdx: state.rank,

      last: last ? { by: last.by, rank: RANKS[last.rank], n: last.n, at: last.at, no: last.no } : null,

      { title: 'Your turn', text: 'Players take turns clockwise. On your turn, put one to four cards face down on the pile and claim they’re the rank in sequence: the first player plays Aces, the next 2s, then 3s, and so on up to Kings, then back to Aces. The app announces your claim, such as “two 7s”.' },

    var me = player(state, pid);

    return (n === 1 ? '1 card' : n + ' cards') + ' in your hand · ' + rankName(RANKS[state.rank], 2) + ' next';

    id: 'bull',
    name: 'Bull',
    shortName: 'Bull',
    fan: ['7S', '7D', 'QC'],
    tagline: 'Play your cards face down and claim they’re the next rank. Bluff your way out, or call Bull on a liar.',
    handText: 'the whole deck dealt out',

/* ==========================================================================
   GAME MODE · BULL — computer player
   Sees only what a person in that seat would see (its view). Plays its true
   cards when it has them, now and then slipping in an extra; with nothing
   true to play, it bluffs with the cards it will need least soon. It calls
   Bull when a claim can't be true (it holds too many of that rank itself),
   and otherwise when a claim looks unlikely, more readily when the player is
   close to winning and less when the pile it might pick up is big.

    normal: { spot: 1, bar: 0.68, memory: true, extra: 0.12, react: [750, 1600] },
    sharp: { spot: 1, bar: 0.58, memory: true, extra: 0.2, react: [600, 1300] }

     how many of the rank this seat knows are elsewhere (its own hand, and

    var mine = v.hand.length;

    var accused = v.players.filter(function (p) { return p.id === last.by; })[0];

/* ==========================================================================

        '<span class="coach-arrow" aria-hidden="true"></span>' +
        '<div class="coach-top"><span class="coach-step"></span>' +
        '<button type="button" class="coach-skip">Leave tutorial</button></div>' +
        '<p class="coach-title"></p>' +

      '<div class="me" id="t-me">' +
        '<div class="me-info"><span class="me-name">You' + UI.icon.flame + '</span><span class="me-count" id="t-mycount"></span></div>' +
        '<div class="slot" id="slot-' + me + '"></div>' +
        '<div class="me-action"><button class="btn btn-primary btn-play" id="t-play" type="button" hidden></button></div>' +
      '</div>' +
      '<div class="hand-wrap" id="t-handwrap"><div class="hand" id="t-hand"></div></div>';

    var seats = this.root.querySelector('#t-seats');
    var self = this;
    opps.forEach(function (p, i) {
      var seat = document.createElement('div');
      seat.className = 'seat';
      seat.dataset.pid = p.id;
      seat.style.setProperty('--paint', PAINTS[i % PAINTS.length]);
      seat.innerHTML =
        '<div class="seat-row"><span class="avatar">' + UI.esc(p.name.charAt(0)) + UI.icon.flame + '</span>' +
        '<span class="seat-count"><span class="mini-back"></span><b></b></span></div>' +
        '<span class="seat-name">' + UI.esc(p.name) + '</span>' +
        '<div class="slot" id="slot-' + p.id + '"></div>' +
        '<span class="seat-chip"></span>';
      seats.appendChild(seat);
      self.seatEls[p.id] = {
        seat: seat,
        avatar: seat.querySelector('.avatar'),
        mini: seat.querySelector('.mini-back'),
        count: seat.querySelector('.seat-count b'),
        chip: seat.querySelector('.seat-chip'),
        slot: seat.querySelector('.slot')
      };
    });

    this.el = {
      set: this.root.querySelector('#t-set'),
      music: this.root.querySelector('#t-music'),
      sound: this.root.querySelector('#t-sound'),
      deck: this.root.querySelector('#t-deck'),
      deckTop: this.root.querySelector('#t-deck .deck-stack .card:last-child'),
      deckCount: this.root.querySelector('#t-deckcount'),
      lead: this.root.querySelector('#t-lead'),
      leadContent: this.root.querySelector('#t-leadcontent'),
      leadLabel: this.root.querySelector('#t-leadlabel'),
      ring: this.root.querySelector('#t-lead .ring'),
      ringFg: this.root.querySelector('#t-lead .ring .fg'),
      timer: this.root.querySelector('#t-timer'),
      aside: this.root.querySelector('#t-aside'),
      asideTop: this.root.querySelector('#t-aside .aside-stack'),
      asideCount: this.root.querySelector('#t-asidecount'),
      statusMain: this.root.querySelector('#t-status .status-main'),
      statusSub: this.root.querySelector('#t-status .status-sub'),
      me: this.root.querySelector('#t-me'),
      myCount: this.root.querySelector('#t-mycount'),
      mySlot: this.root.querySelector('#slot-' + me),
      play: this.root.querySelector('#t-play'),
      handWrap: this.root.querySelector('#t-handwrap'),
      hand: this.root.querySelector('#t-hand')
    };
    var $p = function (id) { return self.root.querySelector('#' + id); };
    this.pen = {
      root: $p('t-pen'), title: $p('pen-title'), who: $p('pen-who'), deck: $p('pen-deck'), suit: $p('pen-suit'),
      row: $p('pen-row'), tally: $p('pen-tally'), soft: $p('pen-soft'), hard: $p('pen-hard'),
      say: $p('pen-say'), act: $p('pen-act'), timer: $p('pen-timer'), done: $p('pen-done')
    };
    this.pen.act.addEventListener('click', function (e) {
      var b = e.target.closest('button');
      if (!b || b.disabled) return;
      if (b.dataset.suit) self.penaltyMove('suit', { suit: b.dataset.suit });
      else if (b.id === 'pen-next') self.penaltyMove('next', {});
    });
    // Stop counts the moment it's pressed
    this.pen.act.addEventListener('pointerdown', function (e) {
      var b = e.target.closest('#pen-stop');
      if (!b || b.disabled) return;
      e.preventDefault();
      self.penaltyMove('stop', {});
    });
    this.pen.act.addEventListener('keydown', function (e) {
      if ((e.key === 'Enter' || e.key === ' ') && e.target.id === 'pen-stop') { e.preventDefault(); self.penaltyMove('stop', {}); }
    });
    this.renderAudio();

    // input
    this.root.querySelector('#t-menu').addEventListener('click', function () { self.app.openMenu(); });
    this.el.music.addEventListener('click', function () { self.app.toggleMusic(); self.renderAudio(); });
    this.el.sound.addEventListener('click', function () { self.app.toggleSound(); self.renderAudio(); });
    this.el.hand.addEventListener('click', function (e) {
      var btn = e.target.closest('.hcard');
      if (btn) self.tapCard(btn.dataset.id, btn);
    });
    this.el.play.addEventListener('click', function () { if (self.selected) self.play(self.selected); });
    this.el.deck.addEventListener('pointerdown', function (e) { e.preventDefault(); self.tapDeck(); });
    this.el.deck.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); self.tapDeck(); }
    });
    this.root.addEventListener('click', function (e) {
      var t = e.target.closest('[data-take]');
      if (t) self.take(t.dataset.take);
    });
  };

  BurnsTable.prototype.renderAudio = function () {
    var m = UI.Music.on, s = UI.Sound.on;
    this.el.music.innerHTML = m ? UI.icon.musicOn : UI.icon.musicOff;
    this.el.music.setAttribute('aria-label', m ? 'Music on. Tap to turn it off.' : 'Music off. Tap to turn it on.');
    this.el.music.classList.toggle('off', !m);
    this.el.sound.innerHTML = s ? UI.icon.soundOn : UI.icon.soundOff;
    this.el.sound.setAttribute('aria-label', s ? 'Sound effects on. Tap to mute.' : 'Sound effects off. Tap to turn on.');
    this.el.sound.classList.toggle('off', !s);
  };

  /* ---------- update cycle ---------- */

  BurnsTable.prototype.update = function () {
    var v = this.session.view(this.me, { sinceSeq: this.lastSeq });
    var events = v.events || [];
    var prev = this.v;
    this.v = v;
    var pre = (events.length && prev && !this.quiet) ? this.capture(prev) : null;
    var plan = (!this.quiet && events.length) ? this.plan(events, pre, v) : { flights: [], intoSlots: false };
    this.render(v, plan);
    if (plan.flights.length) this.run(plan);
    if (!this.quiet) this.react(events, v);
    var self = this;
    events.forEach(function (e) { self.logEvent(e, v); });
    if (events.some(function (e) { return e.type === 'out'; })) this.renderStatus(v);   // "… is out and safe!"
    if (events.length) this.lastSeq = events[events.length - 1].seq;
    this.first = false;
    this.quiet = false;
    if (this.app.logOpen) this.app.renderLog();

    if (v.phase === 'over' && !this.overShown) {
      this.overShown = true;
      var wait = v.winReason === 'flush' ? 1700 : 2400;
      if (!events.length) wait = 200;
      this.overTimer = setTimeout(function () { self.app.showResult(self.v); }, wait);
    }
  };

  /* Where cards are on screen right now (before the DOM changes). */
  BurnsTable.prototype.capture = function (prev) {
    var pre = { hand: {}, table: [] };
    for (var id in this.handEls) pre.hand[id] = this.handEls[id].getBoundingClientRect();
    var self = this;
    prev.table.forEach(function (e) {
      if (!e.card) return;
      var el = null;
      if (e.via === 'starter') el = self.el.leadContent.querySelector('.starter-card .flip');
      else {
        var st = self.slotState[e.owner];
        if (st && st.flip) el = st.flip;
      }
      if (el) pre.table.push({ card: e.card, rect: el.getBoundingClientRect(), gone: e.gone });
    });
    return pre;
  };

  /* Work out the card flights for a batch of events; hide their landing spots. */
  BurnsTable.prototype.plan = function (events, pre, v) {
    var me = this.me;
    var flights = [];
    var self = this;
    var intoSlots = false;
    var drawsBy = {};
    function preTable(cardId) {
      if (!pre) return null;
      for (var i = 0; i < pre.table.length; i++) if (pre.table[i].card.id === cardId) return pre.table[i];
      return null;
    }
    function add(f) {
      if (f.hide) self.hide(f.hide);
      if (f.to.indexOf('slot:') === 0) intoSlots = true;
      flights.push(f);
    }

    events.forEach(function (e) {
      if (e.type === 'deal') {
        var k = 0;
        for (var r = 0; r < e.handSize; r++) {
          e.order.forEach(function (pid) {
            var delay = 120 + k * 70;
            k++;
            if (pid === me && e.mine) {
              var c = e.mine.hand[r];
              add({ from: 'deck', to: 'h:' + c.id, card: c, delay: delay, duration: 340, hide: 'h:' + c.id, sound: 'deal' });
            } else {
              add({ from: 'deck', to: 'seat:' + pid, card: null, delay: delay, duration: 320, sound: 'deal' });
            }
          });
        }
        self.dealDoneAt = performance.now() + 120 + k * 70 + 340;
      } else if (e.type === 'setStart' && pre) {
        pre.table.forEach(function (t, i) {
          if (!t.gone) add({ fromRect: t.rect, to: 'aside', card: t.card, delay: i * 45, duration: 420 });
        });
      } else if (e.type === 'lead' || e.type === 'commit') {
        if (e.player === me && e.mine) {
          // a card drawn in this same batch (time ran out) starts from the deck
          var r1 = pre && pre.hand[e.mine.card.id];
          if (r1) add({ fromRect: r1, to: 'slot:' + me, card: e.mine.card, duration: 300, hide: 'slot:' + me });
          else add({ from: 'deck', to: 'slot:' + me, card: e.mine.card, duration: 360, delay: (drawsBy[me] || 0) * 90, hide: 'slot:' + me });
        } else {
          add({ from: 'seat:' + e.player, to: 'slot:' + e.player, card: e.card || null, duration: 340, delay: (drawsBy[e.player] || 0) * 90, hide: 'slot:' + e.player });
        }
      } else if (e.type === 'draw') {
        var n = drawsBy[e.player] = (drawsBy[e.player] || 0) + 1;
        var delay = (n - 1) * 90;
        if (e.player === me && e.mine) {
          add({ from: 'deck', to: 'h:' + e.mine.card.id, card: e.mine.card, duration: 330, delay: delay, hide: 'h:' + e.mine.card.id });
        } else {
          add({ from: 'deck', to: 'seat:' + e.player, card: null, duration: 300, delay: delay });
        }
      } else if (e.type === 'take') {
        var src = preTable(e.card.id);
        var fromRect = src ? src.rect : null;
        if (e.player === me) add({ fromRect: fromRect, to: 'h:' + e.card.id, card: e.card, duration: 380, hide: 'h:' + e.card.id });
        else add({ fromRect: fromRect, to: 'seat:' + e.player, card: e.card, duration: 380 });
      }
    });
    return { flights: flights, intoSlots: intoSlots };
  };

  BurnsTable.prototype.target = function (key) {
    if (key === 'deck') return this.el.deckTop;
    if (key === 'aside') return this.el.asideTop;
    if (key.indexOf('h:') === 0) return this.handEls[key.slice(2)] || null;
    if (key.indexOf('slot:') === 0) {
      var st = this.slotState[key.slice(5)];
      return st && st.flip ? st.flip : null;
    }
    if (key.indexOf('seat:') === 0) {
      var s = this.seatEls[key.slice(5)];
      return s ? s.mini : this.el.mySlot;
    }
    return null;
  };

  BurnsTable.prototype.run = function (plan) {
    var self = this;
    plan.flights.forEach(function (f) {
      var from = f.fromRect ? null : (f.from.indexOf('seat:') === 0 ? (self.seatEls[f.from.slice(5)] || {}).avatar : self.target(f.from));
      var to = self.target(f.to);
      if (f.sound) setTimeout(function () { UI.Sound.play(f.sound); }, f.delay || 0);
      UI.fly({ from: from, fromRect: f.fromRect, to: to, card: f.card, delay: f.delay, duration: f.duration })
        .then(function () { if (f.hide) self.unhide(f.hide); });
    });
  };

  BurnsTable.prototype.hide = function (key) { this.hidden[key] = (this.hidden[key] || 0) + 1; };
  BurnsTable.prototype.unhide = function (key) {
    this.hidden[key] = Math.max(0, (this.hidden[key] || 0) - 1);
    if (this.hidden[key]) return;
    delete this.hidden[key];
    var el = this.target(key);
    if (el) el.style.visibility = '';
  };

  /* ---------- rendering ---------- */

  BurnsTable.prototype.render = function (v, plan) {
    this.renderTop(v);
    this.renderSeats(v, plan);
    this.renderRail(v);
    this.renderStatus(v);
    this.renderMe(v, plan);
    this.renderHand(v);
    this.renderPenalty(v);
  };

  BurnsTable.prototype.renderTop = function (v) {
    this.el.set.textContent = v.phase === 'dealing' ? 'Dealing'
      : v.phase === 'penalty' || (v.phase === 'over' && v.winReason === 'real') ? 'Penalty round' : 'Set ' + v.setNo;
  };

  function ordinal(n) {
    var s = ['th', 'st', 'nd', 'rd'], m = n % 100;
    return n + (s[(m - 20) % 10] || s[m] || s[0]);
  }

  BurnsTable.prototype.entryFor = function (v, pid) {
    for (var i = 0; i < v.table.length; i++) if (v.table[i].owner === pid) return v.table[i];
    return null;
  };

  BurnsTable.prototype.renderSeats = function (v, plan) {
    var self = this;
    var revealOrder = 0;
    v.players.forEach(function (p) {
      if (p.id === self.me) return;
      var s = self.seatEls[p.id];
      if (!s) return;
      s.count.textContent = p.handCount;
      s.seat.setAttribute('aria-label', p.name + ', ' + (p.out ? 'out and safe' : p.handCount + ' cards') + (v.loser === p.id ? ', lost' : ''));
      s.seat.classList.toggle('is-leader', p.isLeader);
      s.seat.classList.toggle('is-active', self.isActive(v, p));
      s.seat.classList.toggle('is-out', !!p.out);
      s.seat.classList.toggle('is-loser', v.loser === p.id);
      var chip = self.chipFor(v, p);
      s.chip.textContent = chip.text;
      s.chip.className = 'seat-chip' + (chip.tone ? ' ' + chip.tone : '');
      if (self.renderSlot(s.slot, p.id, v, plan, revealOrder)) revealOrder++;
    });
    this.revealCount = revealOrder;
  };

  BurnsTable.prototype.isActive = function (v, p) {
    if (p.out) return false;
    if (v.phase === 'lead') return p.isLeader;
    if (v.phase === 'follow') return !p.isLeader && !p.committed && !p.isTaker;
    if (v.phase === 'take') return p.isTaker && !p.took;
    if (v.phase === 'penalty' && v.penalty) {
      var P = v.penalty;
      return P.step === 'shuffle' || P.step === 'suit' ? p.id === v.loser : P.step === 'result' && p.id === P.shuffler;
    }
    return false;
  };

  BurnsTable.prototype.chipFor = function (v, p) {
    var won = v.setResult && v.setResult.player === p.id && (v.phase === 'reveal' || v.phase === 'over');
    // Real Burns: who's safe, who lost, and whose turn it is in the penalty round
    if (v.loser === p.id && (v.phase === 'lost' || v.phase === 'penalty' || v.phase === 'over')) return { text: 'lost', tone: 'warn' };
    if (v.phase === 'penalty' && v.penalty && v.penalty.shuffler === p.id) {
      var step = v.penalty.step;
      return { text: step === 'shuffle' ? 'shuffling' : step === 'result' ? 'slapping' : 'turning over', tone: 'hot' };
    }
    if (p.out) return { text: 'safe · ' + ordinal(p.place), tone: 'ok' };
    switch (v.phase) {
      case 'lead': return p.isLeader ? { text: 'choosing…', tone: 'hot' } : { text: '' };
      case 'follow':
        if (p.isLeader) return { text: 'led' };
        if (p.isTaker) return { text: 'can’t follow', tone: 'warn' };
        if (p.committed) return { text: p.drew ? 'drew ' + p.drew + ' · in' : 'card in' };
        if (p.drew) return { text: 'drawing · ' + p.drew, tone: 'hot' };
        return { text: 'thinking…' };
      case 'take':
        if (p.isTaker) return p.took ? { text: 'took one' } : { text: 'taking…', tone: 'hot' };
        return { text: p.drew ? 'drew ' + p.drew : '' };
      case 'reveal':
      case 'over':
        if (won) return { text: 'wins the set', tone: 'hot' };
        if (p.took) return { text: 'picked one up' };
        return { text: p.drew ? 'drew ' + p.drew : '' };
    }
    return { text: '' };
  };

  /* Returns true when this slot flips face up in this render (for staggering). */
  BurnsTable.prototype.renderSlot = function (slotEl, pid, v, plan, order) {
    var st = this.slotState[pid] || (this.slotState[pid] = { flip: null, key: null, up: false });
    var entry = this.entryFor(v, pid);
    var flipped = false;
    var tag = null;

    if (!entry) {
      if (st.flip) { st.flip.parentNode && st.flip.parentNode.removeChild(st.flip); st.flip = null; st.key = null; st.up = false; }
      slotEl.classList.remove('winner', 'takeable', 'gone');
      slotEl.removeAttribute('data-take');
    } else {
      var key = v.setNo + '|' + entry.owner + '|' + entry.via;
      if (st.key !== key) {
        if (st.flip && st.flip.parentNode) st.flip.parentNode.removeChild(st.flip);
        var f = makeFlip();
        st.flip = f.flip; st.inner = f.inner; st.front = f.front; st.key = key; st.up = false;
        slotEl.appendChild(st.flip);
      }
      var card = entry.card;
      if (card) UI.setCard(st.front, card);
      var wantUp = !!card;
      if (wantUp !== st.up) {
        var isReveal = wantUp && v.revealed && entry.owner !== this.me && !(entry.via === 'lead' && v.options.leadCard === 'faceUp');
        if (isReveal && !this.quiet) {
          st.flip.classList.remove('no-anim');
          void st.flip.offsetWidth;
          st.inner.style.transitionDelay = ((plan.intoSlots ? 380 : 40) + order * 90) + 'ms';
          flipped = true;
        } else {
          st.flip.classList.add('no-anim');
          st.inner.style.transitionDelay = '0ms';
        }
        st.flip.dataset.up = wantUp ? '1' : '0';
        st.up = wantUp;
        if (!isReveal || this.quiet) { void st.flip.offsetWidth; st.flip.classList.remove('no-anim'); }
      }
      st.flip.style.visibility = this.hidden['slot:' + pid] ? 'hidden' : '';

      var won = v.setResult && v.setResult.player === pid && (v.phase === 'reveal' || v.phase === 'over' || v.phase === 'lost');
      slotEl.classList.toggle('winner', !!won);
      slotEl.classList.toggle('gone', !!entry.gone);
      var takeable = v.canTake && card && !entry.takenBy;
      slotEl.classList.toggle('takeable', !!takeable);
      if (takeable) slotEl.dataset.take = card.id; else slotEl.removeAttribute('data-take');
      if (won && pid === this.me) tag = { text: 'wins', tone: 'ember' };
      else if (entry.gone && entry.takenBy) tag = { text: '→ ' + this.name(entry.takenBy), tone: '' };
      else if (takeable) tag = { text: 'take', tone: '' };
    }

    // hidden-from-others marker on your own card before the reveal
    var eye = slotEl.querySelector('.eye');
    var showEye = pid === this.me && entry && entry.card && !v.revealed && v.phase !== 'over' &&
      !(entry.via === 'lead' && v.options.leadCard === 'faceUp');   // a face-up lead is public
    if (showEye && !eye) {
      eye = document.createElement('span');
      eye.className = 'eye';
      eye.title = 'Only you can see this card until the reveal';
      eye.innerHTML = UI.icon.eyeOff;
      slotEl.appendChild(eye);
    } else if (!showEye && eye) eye.parentNode.removeChild(eye);

    var tagEl = slotEl.querySelector('.slot-tag');
    if (tag) {
      if (!tagEl) { tagEl = document.createElement('span'); slotEl.appendChild(tagEl); }
      tagEl.className = 'slot-tag' + (tag.tone ? ' ' + tag.tone : '');
      tagEl.innerHTML = tag.text;
    } else if (tagEl) tagEl.parentNode.removeChild(tagEl);
    return flipped;
  };

  BurnsTable.prototype.renderRail = function (v) {
    var deck = this.el.deck;
    deck.classList.toggle('can-draw', !!v.mustDraw);
    deck.classList.toggle('may-draw', !!v.mayDraw);
    deck.classList.toggle('empty', v.deckCount === 0);
    this.el.deckCount.textContent = v.deckCount === 0 ? 'empty' : v.deckCount + ' left';
    deck.setAttribute('aria-label', v.canDraw ? 'Deck, ' + v.deckCount + ' cards. Tap to draw.' : 'Deck, ' + v.deckCount + ' cards');

    this.el.aside.classList.toggle('empty', v.discard.length === 0);
    this.el.asideCount.textContent = v.discard.length + ' aside';

    // middle of the rail: starter card, suit to follow, or who leads
    var starterEntry = null;
    v.table.forEach(function (e) { if (e.via === 'starter') starterEntry = e; });
    var content = this.el.leadContent;
    var label = { text: '', tone: '' };
    var acting = v.canFollow || v.canDraw;
    var key, html = null;

    if ((v.phase === 'dealing' || (v.phase === 'over' && v.winReason === 'flush')) && v.starter) {
      key = 'starter-deal:' + v.starter.id;
      label.text = 'Starter';
    } else if (starterEntry) {
      key = 'starter:' + starterEntry.card.id;
      label.text = 'Follow ' + UI.suitPlural(v.suit);
      label.tone = acting ? 'hot' : '';
    } else if (v.phase === 'lead') {
      key = 'lead';
      html = '<div class="roundel empty"><span class="q">?</span></div>';
      label.text = v.canLead ? 'Your lead' : this.name(v.leader) + ' leads';
      label.tone = v.canLead ? 'hot' : '';
    } else if (v.suit) {
      key = 'suit:' + v.suit;
      html = '<div class="roundel ' + (UI.isRed(v.suit) ? 'red' : '') + '" aria-label="Suit in play: ' + UI.suitPlural(v.suit) + '">' + UI.suitSvg(v.suit) + '</div>';
      label.text = 'Follow ' + UI.suitPlural(v.suit);
      label.tone = acting ? 'hot' : '';
    } else {
      key = 'blank';
      html = '<div class="roundel empty"></div>';
    }
    if (v.phase === 'take') { label.text = 'Deck empty'; label.tone = 'ember'; }
    if (v.phase === 'reveal' && v.setResult) { label.text = v.setResult.player === this.me ? 'You win it' : this.name(v.setResult.player) + ' wins'; label.tone = 'ember'; }
    if (v.phase === 'lost') { label.text = v.loser === this.me ? 'You lose' : this.name(v.loser) + ' loses'; label.tone = 'ember'; }

    if (content.dataset.key !== key) {
      content.dataset.key = key;
      if (html != null) content.innerHTML = html;
      else {
        var card = key.indexOf('starter-deal:') === 0 ? v.starter : starterEntry.card;
        content.innerHTML = '';
        var wrap = document.createElement('div');
        wrap.className = 'starter-card';
        var f = makeFlip();
        f.flip.classList.add('no-anim');
        UI.setCard(f.front, card);
        wrap.appendChild(f.flip);
        content.appendChild(wrap);
        if (v.phase === 'dealing' && !this.quiet) {
          // turn the starter face up once the deal has landed
          var wait = Math.max(0, (this.dealDoneAt || performance.now()) - performance.now());
          wrap.classList.add('deal-in');
          wrap.style.animationDelay = Math.max(0, wait - 350) + 'ms';
          setTimeout(function () { f.flip.classList.remove('no-anim'); f.flip.dataset.up = '1'; UI.Sound.play('flip'); }, wait + 60);
        } else {
          f.flip.dataset.up = '1';

  /* A move. At this table the answer is immediate; at an online table it
     comes back from the server a moment later, and further taps wait for it. */
  BurnsTable.prototype.send = function (type, payload, then) {
    if (this.sending) return;
    var self = this;
    this.sending = true;
    var finish = function (res) { self.sending = false; then(res); };
    var res = this.session.act(this.me, type, payload, finish);
    if (!res || !res.pending) finish(res);
  };

  BurnsTable.prototype.play = function (id) {
    var v = this.v, self = this;
    this.send(v.canLead ? 'lead' : 'follow', { cardId: id }, function (res) {
      if (!res.ok) { UI.toast(UI.esc(res.message)); UI.Sound.play('nope'); return; }
      self.selected = null;
      UI.Sound.play('play');
      UI.buzz(10);
    });
  };

  BurnsTable.prototype.tapDeck = function () {
    var v = this.v;
    if (!v) return;
    UI.Sound.unlock();
    var deck = this.el.deck;
    if (!v.canDraw) {
      if (v.canFollow && v.deckCount === 0) UI.toast('The deck is empty. Play a ' + UI.suit(v.suit) + ' ' + UI.suitSingle(v.suit) + '.');
      else if (v.canLead) UI.toast('The leader doesn’t draw. Lead any card.');
      return;
    }
    var self = this;
    this.send('draw', {}, function (res) {
      if (res.ok) {
        var cd = v.timing.drawCooldownMs;
        deck.classList.remove('cooling');
        void deck.offsetWidth;
        deck.style.setProperty('--cool', cd + 'ms');
        deck.classList.add('cooling');
        clearTimeout(self.coolTimer);
        self.coolTimer = setTimeout(function () { deck.classList.remove('cooling'); }, cd);
        UI.Sound.play('draw');
        UI.buzz(8);
        if (res.matched) UI.toast('Found ' + UI.cardText(res.card) + '. Play it, or keep drawing.', 2400);
      } else if (res.code === 'cooldown') {
        deck.classList.remove('wiggle');
        void deck.offsetWidth;
        deck.classList.add('wiggle');
      } else {
        UI.toast(UI.esc(res.message));
      }
    });
  };

  BurnsTable.prototype.take = function (cardId) {
    var v = this.v;
    if (!v || !v.canTake) return;
    this.send('take', { cardId: cardId }, function (res) {
      if (!res.ok) { UI.toast(UI.esc(res.message)); UI.Sound.play('nope'); return; }
      UI.Sound.play('draw');
      UI.buzz(10);
    });
  };

  /* ---------- sounds and notices for things other players did ---------- */

  BurnsTable.prototype.react = function (events, v) {
    var me = this.me;
    events.forEach(function (e) {
      switch (e.type) {
        case 'lead':
        case 'commit':
          if (e.player !== me) UI.Sound.play('play');
          break;
        case 'draw':
          if (e.player !== me || e.auto) UI.Sound.play('draw');
          break;
        case 'reveal':
          setTimeout(function () { UI.Sound.play('flip'); }, 420);
          break;
        case 'setWon':
          if (e.player === me && v.phase !== 'over') setTimeout(function () { UI.Sound.play('win'); }, 700);
          break;
        case 'deckEmpty':
          UI.toast('The deck is empty.');
          break;
        case 'stuck':
          if (e.players.indexOf(me) >= 0) UI.toast('No ' + UI.suit(e.suit) + ' and the deck is empty. You’ll take from the set.', 2600);
          break;
        case 'timeout':
          if (e.players.indexOf(me) >= 0) {
            UI.toast(e.phase === 'lead' ? 'Time’s up. A random card was led for you.' : 'Time’s up. A random card was played for you.', 2600);
            UI.Sound.play('nope');
          }
          break;
        case 'takeStart':
          if (e.takers.indexOf(me) >= 0) UI.Sound.play('alert');
          break;
        case 'take':
          if (e.player !== me) UI.Sound.play('draw');
          if (e.player === me && e.auto) UI.toast('Time’s up. You picked up ' + UI.cardText(e.card) + '.');
          break;
        case 'gameOver':
          var iWon = e.winners.indexOf(me) >= 0;
          setTimeout(function () { UI.Sound.play(iWon ? 'victory' : 'lose'); }, e.reason === 'flush' ? 1200 : 1500);
          break;
        // Real Burns
        case 'out':
          if (e.players.indexOf(me) >= 0) setTimeout(function () { UI.Sound.play('win'); }, e.flush ? 1200 : 700);
          break;
        case 'loser':
          setTimeout(function () { UI.Sound.play(e.player === me ? 'lose' : 'alert'); }, 600);
          if (e.player === me) UI.buzz(80);
          break;
        case 'penaltyStop':
          UI.Sound.play('thud');
          break;
        case 'penaltyCard':
          if (e.match) UI.Sound.play(e.n === 1 ? 'victory' : 'flip');
          else UI.Sound.play(UI.isRed(e.card.suit) ? 'slapHard' : 'slapSoft');
          if (!e.match && v.loser === me) UI.buzz(UI.isRed(e.card.suit) ? 40 : 15);
          break;
      }
    });
  };

  /* ---------- play-by-play ---------- */

  BurnsTable.prototype.pushLog = function (html, cls) {
    var item = { html: html, cls: cls || '' };
    this.logItems.push(item);
    if (this.logItems.length > 600) this.logItems.shift();
    return item;
  };

  BurnsTable.prototype.logEvent = function (e, v) {
    var self = this;
    var me = this.me;
    var N = function (pid) { return self.name(pid); };
    var timed = ' (time ran out, so it was picked at random)';
    switch (e.type) {
      case 'deal':
        this.pushLog('Dealt ' + e.handSize + ' cards to each of ' + e.order.length + ' players.', 'set');
        if (e.mine) this.pushLog('Your hand: ' + sortHand(e.mine.hand).map(UI.cardText).join(' '));
        break;
      case 'flush':
        this.pushLog('Flush! ' + list(e.players.map(N)) + (e.players.length > 1 ? ' hold' : ' holds') + ' all four suits.', 'win');
        break;
      case 'noFlush':
        this.pushLog('No Flush on the deal.');
        break;
      case 'setStart':
        if (e.setNo === 1) this.pushLog('Set 1 · starter card ' + UI.cardText(e.starter) + ', so everyone follows ' + UI.suit(e.suit) + '.', 'set');
        else this.pushLog('Set ' + e.setNo + ' · ' + N(e.leader) + ' to lead.', 'set');
        break;
      case 'timeout':
        this.pushLog('Time ran out for ' + list(e.players.map(function (p) { return N(p) === 'You' ? 'you' : N(p); })) + '.');
        break;
      case 'lead':
        if (e.player === me && e.mine) this.pushLog('You led ' + UI.cardText(e.mine.card) + (e.auto ? timed : '') + (e.card ? '.' : ' Others only see the suit.'));
        else this.pushLog(N(e.player) + ' led ' + (e.card ? UI.cardText(e.card) : UI.suit(e.suit) + ' (card hidden)') + (e.auto ? timed : '') + '.');
        break;
      case 'commit':
        this.pushLog((e.player === me && e.mine ? 'You played ' + UI.cardText(e.mine.card) : N(e.player) + ' played a card') + (e.auto ? timed : '') + '.');
        break;
      case 'draw': {
        var k = this.lastSetNo + ':' + e.player;
        var d = this.drawLog[k];
        if (!d) d = this.drawLog[k] = { item: this.pushLog(''), n: 0, cards: [] };
        d.n = e.n;
        if (e.mine) d.cards.push(e.mine.card);
        d.item.html = e.player === me
          ? 'You drew ' + d.cards.map(UI.cardText).join(', ') + '.'
          : N(e.player) + ' drew ' + d.n + (d.n === 1 ? ' card.' : ' cards.');
        break;
      }
      case 'deckEmpty':
        this.pushLog('The deck is empty.');
        break;
      case 'stuck':
        this.pushLog(list(e.players.map(N)) + ' can’t follow ' + UI.suit(e.suit) + ' and can’t draw.');
        break;
      case 'reveal':
        this.pushLog('Reveal: ' + e.cards.filter(function (c) { return c.owner; }).map(function (c) {
          return N(c.owner) + ' ' + UI.cardText(c.card);
        }).join(' · '));
        break;
      case 'takeStart':
        this.pushLog(list(e.takers.map(N)) + (e.takers.length > 1 ? ' have' : ' has') + ' 10 seconds to take a card from the set.');
        break;
      case 'take':
        this.pushLog(N(e.player) + ' picked up ' + UI.cardText(e.card) +
          (e.from ? ' (' + (e.from === me ? 'yours' : N(e.from) + '’s') + ')' : ' (the starter)') +
          (e.auto ? ', picked at random when time ran out.' : '.'));
        break;
      case 'setWon':
        if (e.card) this.pushLog(N(e.player) + ' won the set with ' + UI.cardText(e.card) + '.', 'win');
        break;
      case 'gameOver':
        if (e.reason === 'empty') this.pushLog(list(e.winners.map(N)) + (e.winners[0] === me ? ' emptied your hand and won!' : ' emptied their hand and won.'), 'win');
        if (e.reason === 'real') this.pushLog((e.loser === me ? 'You lost and take ' : N(e.loser) + ' lost and takes ') + slapsText(e.soft, e.hard) + ' in all.', 'win');
        break;
      // Real Burns
      case 'out':
        this.pushLog(list(e.players.map(function (p, i) { return N(p) + ' (' + ordinal(e.places[i]) + ')'; })) +
          (e.players.length > 1 ? ' are' : e.players[0] === me ? ' are' : ' is') + ' out and safe' + (e.flush ? ' with a Flush.' : '.'), 'win');
        break;
      case 'loser':
        this.pushLog((e.player === me ? 'You’re' : N(e.player) + ' is') + ' left holding cards and ' + (e.player === me ? 'lose.' : 'loses.'), 'set');
        break;
      case 'penaltyStart':
        this.pushLog('Penalty round: ' + list(e.order.map(N)) + (e.order.length > 1 ? ' each take a turn.' : ' takes a turn.'), 'set');
        break;
      case 'penaltyTurn':
        this.pushLog((e.shuffler === me ? 'You shuffle.' : N(e.shuffler) + ' shuffles.'));
        break;
      case 'penaltyStop':
        this.pushLog(e.auto ? 'The shuffle stopped by itself.' : N(e.player) + (e.player === me ? ' say' : ' says') + ' “Stop!”');
        break;
      case 'penaltySuit':
        this.pushLog((e.auto ? 'A suit was picked for ' + (e.player === me ? 'you' : N(e.player)) + ': ' : (e.player === me ? 'You pick ' : N(e.player) + ' picks ')) + UI.suit(e.suit) + ' ' + UI.suitPlural(e.suit) + '.');
        this.penLog = this.pushLog('');
        this.penCards = [];
        break;
      case 'penaltyCard':
        if (this.penLog) {
          this.penCards.push(e.card);
          this.penLog.html = (e.shuffler === me ? 'You turned over ' : N(e.shuffler) + ' turned over ') + this.penCards.map(UI.cardText).join(' ') + '.';
        }
        break;
      case 'penaltyResult':
        this.pushLog(e.lucky ? 'Lucky: the first card was a ' + UI.suitSingle(e.suit) + ', so no slaps from ' + (e.shuffler === me ? 'you' : N(e.shuffler)) + '.'
          : slapsText(e.soft, e.hard).charAt(0).toUpperCase() + slapsText(e.soft, e.hard).slice(1) + ' from ' + (e.shuffler === me ? 'you' : N(e.shuffler)) + '.', 'win');
        break;
    }
    if (e.type === 'setStart') this.lastSetNo = e.setNo;
    if (e.type === 'out') this.justOut = { set: v.setNo, players: e.players.slice() };
  };

  /* ---------- end of game ---------- */

  /* What the end-of-game sheet shows for Burns: how it was won, any Flush,
     and everyone's cards left. */
  BurnsTable.prototype.result = function (v) {
    var me = this.me;
    var byId = {};
    v.players.forEach(function (p, i) { byId[p.id] = { p: p, i: i }; });
    if (v.winReason === 'real') return this.realResult(v, byId);
    var winners = v.winners || [];
    var iWon = winners.indexOf(me) >= 0;
    var names = winners.map(function (id) { return id === me ? 'You' : UI.esc(byId[id].p.name); });
    var why, cards = '';
    if (v.winReason === 'flush') {
      why = (winners.length > 1 ? names.join(' and ') + ' each held' : (iWon ? 'You held' : names[0] + ' held')) + ' one card of every suit on the deal: a Flush.';
      winners.forEach(function (id) {
        cards += '<div class="result-cards" aria-label="' + (id === me ? 'Your' : UI.esc(byId[id].p.name) + '’s') + ' Flush"></div>';
      });
    } else {
      why = (iWon ? 'You played your last card' : names[0] + ' played their last card') + ' in set ' + v.setNo + '.';
    }
    var standings = v.players.slice().sort(function (a, b) {
      var aw = winners.indexOf(a.id) >= 0 ? -1 : 0, bw = winners.indexOf(b.id) >= 0 ? -1 : 0;
      return (aw - bw) || (a.handCount - b.handCount);
    }).map(function (p) {
      var paint = p.id === me ? 'var(--ink)' : PAINTS[(byId[p.id].i - 1 + PAINTS.length) % PAINTS.length];
      return '<li class="' + (winners.indexOf(p.id) >= 0 ? 'champ' : '') + '"><span class="avatar" style="--paint:' + paint + '">' + UI.esc((p.id === me ? 'You' : p.name).charAt(0)) + '</span>' +
        '<span>' + (p.id === me ? 'You' : UI.esc(p.name)) + '</span><span class="left">' + p.handCount + (p.handCount === 1 ? ' card' : ' cards') + ' left</span></li>';
    }).join('');
    return {
      when: v.winReason === 'flush' ? 'on the deal' : 'set ' + v.setNo,
      why: why,
      body: cards + '<div class="standings"><ul>' + standings + '</ul></div>',
      after: function (sheet) {
        if (v.winReason !== 'flush') return;
        var rows = sheet.querySelectorAll('.result-cards');
        winners.forEach(function (id, k) {
          (byId[id].p.hand || []).forEach(function (c) { rows[k].appendChild(UI.makeCard(c)); });
        });
      }
    };
  };

  /* Real Burns: one loser, everyone else wins, and the slaps each winner gave. */
  BurnsTable.prototype.realResult = function (v, byId) {
    var me = this.me, self = this;
    var iLost = v.loser === me;
    var given = {}, t = { soft: 0, hard: 0 };
    (v.penalty ? v.penalty.results : []).forEach(function (r) { given[r.by] = r; t.soft += r.soft; t.hard += r.hard; });
    var row = function (pid, right, cls) {
      var p = byId[pid].p;
      var paint = pid === me ? 'var(--ink)' : PAINTS[(byId[pid].i - 1 + PAINTS.length) % PAINTS.length];
      return '<li class="' + (cls || '') + '"><span class="avatar" style="--paint:' + paint + '">' + UI.esc((pid === me ? 'You' : p.name).charAt(0)) + '</span>' +
        '<span>' + self.name(pid) + '</span><span class="left">' + right + '</span></li>';
    };
    var rows = (v.winners || []).map(function (pid) {
      var r = given[pid];
      return row(pid, ordinal(byId[pid].p.place || 0) + ' · ' + (!r ? 'safe' : r.lucky ? 'lucky: no slaps' : slapsText(r.soft, r.hard).replace(/ slaps?/g, '')));
    }).join('') + row(v.loser, 'lost', 'loser');
    var name = this.name(v.loser);
    return {
      when: 'set ' + v.setNo,
      title: iLost ? 'YOU LOSE' : String(byId[v.loser].p.name).toUpperCase() + ' LOSES',
      why: iLost ? 'You were left holding cards, so you take ' + slapsText(t.soft, t.hard) + '. Everyone else wins.'
        : name + ' was left holding cards and takes ' + slapsText(t.soft, t.hard) + '. Everyone else wins.',
      body: '<div class="standings"><ul>' + rows + '</ul></div>'
    };
  };

  CT.UI.presenters = CT.UI.presenters || {};
  CT.UI.presenters.burns = BurnsTable;
})(window.CT);

(function (CT) {

  function scriptedBot(lesson) {
    var script = lesson.bots || {};
    return {
      intent: Burns.bot.intent,
      delay: function (intent, v, rnd, now) {
        if (intent.kind === 'lead') return 1300;
        if (intent.kind === 'draw') return v.timing.drawCooldownMs + 350;
        if (intent.kind === 'take') return 1800;
        // Real Burns: a winner's moment, then Next turn (a computer player that lost calls Stop and names hearts)
        if (intent.kind === 'next') return 1500;
        if (intent.kind === 'stop') return Math.max(0, (v.penalty.stopFrom || 0) - (now || 0)) + 1500;
        if (intent.kind === 'suit') return 1400;
        return 1100;
      },
      decide: function (v) {
        if (v.canStop) return { type: 'stop', payload: {} };
        if (v.canSuit) return { type: 'suit', payload: { suit: 'H' } };
        if (v.canNext) return { type: 'next', payload: {} };
        var mine = script[v.me] || {};
        var byId = function (id) { return v.hand.filter(function (c) { return c.id === id; })[0]; };
        var low = function (cards) { return cards.slice().sort(function (a, b) { return val(a) - val(b); })[0]; };
        if (v.canLead) return { type: 'lead', payload: { cardId: (byId(mine.lead) || low(v.hand)).id } };
        if (v.mustDraw) return { type: 'draw', payload: {} };
        if (v.canFollow) {
          var suited = v.hand.filter(function (c) { return c.suit === v.suit; });
          return { type: 'follow', payload: { cardId: (byId(mine.follow) || low(suited)).id } };
        }
        if (v.canTake) {
          var open = v.table.filter(function (e) { return e.card && !e.takenBy; }).sort(function (a, b) { return val(b.card) - val(a.card); });
          return open.length ? { type: 'take', payload: { cardId: open[0].card.id } } : null;
        }
        return null;
      }
    };
  }

  /* Lay out the lesson's cards. Cards not named go under the named deck
     cards (or aside, with fillDeck: false), in a fixed shuffled order. */
  function rig(state, lesson, now) {
    var used = {};
    state.players.forEach(function (p, i) {
      p.hand = lesson.hands[i].map(C);
      lesson.hands[i].forEach(function (id) { used[id] = true; });
    });
    var top = (lesson.deck || []).map(C);
    top.forEach(function (c) { used[c.id] = true; });
    if (lesson.starter) used[lesson.starter] = true;
    var rest = CT.shuffle(CT.standardDeck().filter(function (c) { return !used[c.id]; }), { rng: 2026 });
    if (lesson.fillDeck === false) { state.deck = top.slice().reverse(); state.discard = rest; }
    else { state.deck = rest.concat(top.slice().reverse()); state.discard = []; }
    state.out = (lesson.out || []).slice();   // Real Burns: players already out and safe
    state.events = [];
    state.seq = 0;
    if (lesson.starter) {
      state.starter = C(lesson.starter);
      state.phase = 'dealing';
      state.phaseEndsAt = now;
    } else {
      // jump straight to the lead of the given set
      state.starter = null;
      state.setNo = lesson.setNo - 1;
      state.phase = 'reveal';
      state.setResult = { player: lesson.leader, card: null };
      state.phaseEndsAt = now;
    }
  }

  /* Real Burns: once you've named a suit, the cards the lesson wants turned
     over go on top of the deck. Nobody sees the deck, so it plays like any
     shuffle. Safe to repeat until the first card is turned over. */
  function stackPenalty(state, lesson) {
    var P = state.penalty;
    if (!P || P.step !== 'draw' || P.drawn.length || !P.deck) return;
    var plan = lesson.penalty[P.turn];
    if (!plan) return;
    var blacks = ['S', 'C'].filter(function (s) { return s !== P.suit; });
    var reds = ['H', 'D'].filter(function (s) { return s !== P.suit; });
    var nb = 0, nr = 0;
    var top = plan.map(function (colour, i) {
      return C(['7', 'J', '4', 'K', '2', 'Q'][i] + (colour === 'red' ? reds[nr++ % reds.length] : blacks[nb++ % blacks.length]));
    });
    top.push(C((plan.length ? '9' : 'A') + P.suit));
    var ids = {};
    top.forEach(function (c) { ids[c.id] = true; });
    P.deck = P.deck.filter(function (c) { return !ids[c.id]; }).concat(top.reverse());   // turned over from the end
  }

    var mode = Object.assign({}, Burns, { bot: scriptedBot(lesson) });
    if (lesson.penalty) mode.tick = function (state, now) { stackPenalty(state, lesson); return Burns.tick(state, now); };
    return mode;
  }

  function makeSession(lesson) {
    var mode = modeFor(lesson);
    var timing = Object.assign({ dealHoldMs: 0, revealHoldMs: 2600, takeWindowMs: 60000, turnMs: 0 }, lesson.timing || {});
    var options = Object.assign({ flush: 'off', leadCard: 'faceUp', turnTime: '30' }, lesson.options || {});
    var session = new CT.Session({ mode: mode, players: PLAYERS, options: options, seed: 7, timing: timing });
    rig(session.state, lesson, session.now());
    mode.tick(session.state, session.now());   // start the set right away
    return session;
  }
