    this.el.declare.addEventListener('click', function () { self.declare(); });
    // the race is won on the press, not the release
    this.el.slap.addEventListener('pointerdown', function (e) { e.preventDefault(); self.slap(); });
    this.el.slap.addEventListener('keydown', function (e) {
      if ((e.key === 'Enter' || e.key === ' ') && !e.repeat) { e.preventDefault(); self.slap(); }
    });
    this.el.choices.addEventListener('click', function (e) {
      var b = e.target.closest('button');
      if (!b) return;
      if (b.dataset.target) self.challenge(b.dataset.target);
      if (b.dataset.call) self.call(b.dataset.call);
    });
  };

  DonkeyTable.prototype.renderAudio = function () {
    var m = UI.Music.on, s = UI.Sound.on;
    this.el.music.innerHTML = m ? UI.icon.musicOn : UI.icon.musicOff;
    this.el.music.setAttribute('aria-label', m ? 'Music on. Tap to turn it off.' : 'Music off. Tap to turn it on.');
    this.el.music.classList.toggle('off', !m);
    this.el.sound.innerHTML = s ? UI.icon.soundOn : UI.icon.soundOff;
    this.el.sound.setAttribute('aria-label', s ? 'Sound effects on. Tap to mute.' : 'Sound effects off. Tap to turn on.');
    this.el.sound.classList.toggle('off', !s);
  };

  /* ---------- update cycle ---------- */

  DonkeyTable.prototype.update = function () {
    var v = this.session.view(this.me, { sinceSeq: this.lastSeq });
    var events = v.events || [];
    var prev = this.v;
    this.v = v;
    var pre = (events.length && prev && !this.quiet) ? this.capture() : null;
    var plan = (!this.quiet && events.length) ? this.plan(events, pre, v) : { flights: [] };
    this.render(v);
    if (plan.flights.length) this.run(plan);
    if (!this.quiet) this.react(events, v);
    var self = this;
    events.forEach(function (e) { self.logEvent(e, v); });
    if (events.length) this.lastSeq = events[events.length - 1].seq;
    this.first = false;
    this.quiet = false;
    if (this.app.logOpen) this.app.renderLog();

    if (v.phase === 'over' && !this.overShown) {
      this.overShown = true;
      this.overTimer = setTimeout(function () { self.app.showResult(self.v); }, events.length ? 2400 : 200);
    }
  };

  /* Where things are on screen before the DOM changes. */
  DonkeyTable.prototype.capture = function () {
    var pre = { hand: {} };
    for (var id in this.handEls) pre.hand[id] = this.handEls[id].getBoundingClientRect();
    return pre;
  };

  /* Card flights for a batch of events. */
  DonkeyTable.prototype.plan = function (events, pre, v) {
    var me = this.me, self = this;
    var flights = [];
    function add(f) { if (f.hide) self.hide(f.hide); flights.push(f); }
    events.forEach(function (e) {
      if (e.type === 'deal') {
        var k = 0;
        for (var r = 0; r < e.handSize; r++) {
          e.order.forEach(function (pid) {
            var delay = 120 + k * 55;
            k++;
            if (pid === me && e.mine) {
              var c = e.mine.hand[r];
              add({ from: 'center', to: 'h:' + c.id, card: c, delay: delay, duration: 320, hide: 'h:' + c.id, sound: 'deal' });
            } else {
              add({ from: 'center', to: 'seat:' + pid, card: null, delay: delay, duration: 300, sound: k % 2 ? 'deal' : null });
            }
          });
        }
      } else if (e.type === 'pass') {
        if (e.from === me && e.mine) {
          add({ fromRect: pre && pre.hand[e.mine.card.id], from: 'seat:' + me, to: 'seat:' + e.to, card: e.mine.card, duration: 380 });
        } else if (e.to === me && e.mine) {
          add({ from: 'seat:' + e.from, to: 'h:' + e.mine.card.id, card: e.mine.card, duration: 420, hide: 'h:' + e.mine.card.id });
        } else {
          add({ from: 'seat:' + e.from, to: 'seat:' + e.to, card: null, duration: 380 });
        }
      } else if (e.type === 'declare') {
        e.cards.forEach(function (c, i) {
          var fromRect = e.player === me && pre ? pre.hand[c.id] : null;
          add({ fromRect: fromRect, from: 'seat:' + e.player, to: 'four:' + i, card: c, delay: 70 + i * 55, duration: 340, hide: 'four:' + i });
        });
      }
    });
    return { flights: flights };
  };

  DonkeyTable.prototype.target = function (key) {
    if (key === 'center') return this.el.deck;   // a card-sized spot in the middle of the table
    if (key.indexOf('h:') === 0) return this.handEls[key.slice(2)] || null;
    if (key.indexOf('four:') === 0) return this.el.four.children[+key.slice(5)] || null;
    if (key.indexOf('seat:') === 0) {
      var pid = key.slice(5);
      if (pid === this.me) {
        var cards = this.el.hand.children;
        return cards.length ? cards[Math.floor(cards.length / 2)] : this.el.meAvatar;
      }
      var s = this.seatEls[pid];
      return s ? (s.fan.lastElementChild || s.fan) : null;
    }
    return null;
  };

  DonkeyTable.prototype.run = function (plan) {
    var self = this;
    plan.flights.forEach(function (f) {
      var from = f.fromRect ? null : self.target(f.from);
      var to = self.target(f.to);
      if (f.sound) setTimeout(function () { UI.Sound.play(f.sound); }, f.delay || 0);
      UI.fly({ from: from, fromRect: f.fromRect, to: to, card: f.card, delay: f.delay, duration: f.duration })
        .then(function () { if (f.hide) self.unhide(f.hide); });
    });
  };

  DonkeyTable.prototype.hide = function (key) { this.hidden[key] = (this.hidden[key] || 0) + 1; };
  DonkeyTable.prototype.unhide = function (key) {
    this.hidden[key] = Math.max(0, (this.hidden[key] || 0) - 1);
    if (this.hidden[key]) return;
    delete this.hidden[key];
    var el = this.target(key);
    if (el) el.style.visibility = '';
  };

  /* ---------- rendering ---------- */

  DonkeyTable.prototype.render = function (v) {
    this.el.round.textContent = 'Round ' + v.round;
    this.renderSeats(v);
    this.renderCenter(v);
    this.renderStatus(v);
    this.renderChoices(v);
    this.renderMe(v);
    this.renderHand(v);
  };

  DonkeyTable.prototype.raceEntry = function (v, pid) {
    if (!v.race) return null;
    for (var i = 0; i < v.race.order.length; i++) if (v.race.order[i].player === pid) return { place: i + 1, ms: v.race.order[i].ms };
    return null;
  };

  DonkeyTable.prototype.renderWord = function (el, n, fresh) {
    var bs = el.children;
    for (var i = 0; i < bs.length; i++) {
      bs[i].classList.toggle('on', i < n);
      bs[i].classList.toggle('fresh', !!fresh && i === n - 1);
    }
    el.setAttribute('aria-label', n ? 'Letters: ' + this.v.word.slice(0, n) : 'No letters');
  };

  DonkeyTable.prototype.renderSeats = function (v) {
    var self = this;
    var losers = (v.phase === 'roundEnd' && v.result) ? v.result.losers : [];
    v.players.forEach(function (p) {
      var s = self.seatEls[p.id];
      if (!s) return;
      s.seat.classList.toggle('is-turn', p.isTurn);
      s.seat.classList.toggle('is-down', p.down);
      s.seat.classList.toggle('is-safe', p.declared && (v.phase === 'declared' || v.phase === 'race' || v.phase === 'roundEnd'));
      s.seat.classList.toggle('is-loser', losers.indexOf(p.id) >= 0);
      var inDuel = v.tiebreak && v.tiebreak.duel && (v.tiebreak.duel.challenger === p.id || v.tiebreak.duel.opponent === p.id);
      s.seat.classList.toggle('in-duel', !!inDuel && v.phase === 'tiebreak');
      self.renderWord(s.word, p.letters, losers.indexOf(p.id) >= 0);
      if (p.id === self.me) return;
      // a small fan of card backs
      var n = Math.min(p.handCount, 5);
      while (s.fan.children.length < n) s.fan.appendChild(UI.makeCard(null));
      while (s.fan.children.length > n) s.fan.removeChild(s.fan.lastElementChild);
      s.fan.style.setProperty('--n', n);
      s.seat.setAttribute('aria-label', p.name + ', ' + p.handCount + ' cards, ' + (p.letters ? 'letters ' + v.word.slice(0, p.letters) : 'no letters'));
      var chip = self.chipFor(v, p);
      s.chip.textContent = chip.text;
      s.chip.className = 'seat-chip' + (chip.tone ? ' ' + chip.tone : '');
    });
  };

  DonkeyTable.prototype.chipFor = function (v, p) {
    var r = this.raceEntry(v, p.id);
    switch (v.phase) {
      case 'dealing': return { text: p.id === v.starter ? 'starts' : '' };
      case 'pass': return p.isTurn ? { text: 'passing…', tone: 'hot' } : { text: '' };
      case 'declared':
      case 'race':
        if (p.declared) return { text: 'four ' + RANKS[v.declare.rank] + '!', tone: 'hot' };
        if (r) return { text: PLACES[r.place - 1] + ' · ' + secs(r.ms) };
        return { text: '' };
      case 'roundEnd': {
        var res = v.result;
        if (res.losers.indexOf(p.id) >= 0) return { text: '+' + v.word.charAt(p.letters - 1), tone: 'ember' };
        if (p.id === res.declarer) return { text: 'safe' };
        return { text: r ? secs(r.ms) : '' };
      }
      case 'tiebreak':
      case 'over': {
        var place = v.standings ? v.standings.indexOf(p.id) : -1;
        var d = v.tiebreak && v.tiebreak.duel;
        if (v.phase === 'tiebreak' && d && d.step !== 'reveal' && d.challenger === p.id) return { text: 'challenger', tone: 'hot' };
        if (v.phase === 'tiebreak' && d && d.step !== 'reveal' && d.opponent === p.id) return { text: 'challenged' };
        return { text: place >= 0 ? PLACES[place] : 'in a tie', tone: place === 0 ? 'hot' : '' };
      }
    }
    return { text: '' };
  };

  DonkeyTable.prototype.renderCenter = function (v) {
    var duel = v.tiebreak && v.tiebreak.duel;
    var showDuel = (v.phase === 'tiebreak' || v.phase === 'over') && duel;
    this.el.center.classList.toggle('duel-on', !!showDuel);
    this.el.duel.hidden = !showDuel;
    if (showDuel) { this.renderDuel(v, duel); return; }

    var d = v.declare;
    var key = d ? v.round + ':' + d.player : '';
    if (this.el.four.dataset.key !== key) {
      this.el.four.dataset.key = key;
      this.el.four.innerHTML = '';
      if (d) {
        var self = this;
        d.cards.forEach(function (c, i) {
          var el = UI.makeCard(c);
          el.style.setProperty('--i', i);
          if (self.hidden['four:' + i]) el.style.visibility = 'hidden';
          self.el.four.appendChild(el);
        });
      }
    }
    this.el.center.classList.toggle('has-four', !!d);
    this.el.center.classList.toggle('racing', v.phase === 'race');
    this.el.caption.innerHTML = d
      ? (d.player === this.me ? 'Your' : this.name(d.player) + '’s') + ' four ' + RANKS[d.rank]
      : (v.phase === 'pass' ? 'Passing to the left' : '');
  };

  DonkeyTable.prototype.renderDuel = function (v, d) {
    var me = this.me, self = this;
    var tied = d.players.map(function (pid) { return self.name(pid); });
    var head = 'Tie-breaker for ' + PLACES[d.place] + ' place';
    var cardEl = function (pid) {
      var drawn = d.step !== 'choose';
      if (!pid || !drawn) return '<div class="dk-duel-card empty"></div>';
      var c = d.cards ? d.cards[pid] : (pid === me ? d.myCard : null);
      return '<div class="dk-duel-card" data-card="' + (c ? c.id : '') + '"></div>';
    };
    var side = function (pid, role) {
      return '<div class="dk-duel-side">' + cardEl(pid) +
        '<span class="nm">' + (pid ? self.name(pid) : '…') + '</span><span class="role">' + role + '</span></div>';
    };
    var html = '<p class="dk-duel-head">' + head + '</p>' +
      '<p class="dk-duel-tied">' + list(tied) + ' have ' + this.lettersWord(v, d.players[0]) + '</p>' +
      '<div class="dk-duel-cards">' + side(d.challenger, 'challenger') + '<span class="vs">vs</span>' + side(d.opponent, d.opponent ? 'opponent' : 'being picked') + '</div>';
    if (d.step === 'reveal' && d.result) {
      html += '<p class="dk-duel-call ' + (d.result.right ? 'right' : 'wrong') + '">Called ' + d.call + ' · ' + (d.result.right ? 'right' : 'wrong') + '</p>';
    }
    var key = JSON.stringify([d.n, d.step, d.opponent, !!d.cards, v.canChallenge, v.canCall]);
    if (this.el.duel.dataset.key !== key) {
      this.el.duel.dataset.key = key;
      this.el.duel.innerHTML = html;
      this.el.duel.querySelectorAll('.dk-duel-card[data-card]').forEach(function (el) {
        var id = el.dataset.card;
        var c = null;
        if (id) {
          var all = [d.myCard].concat(d.cards ? Object.keys(d.cards).map(function (k) { return d.cards[k]; }) : []);
          c = all.filter(function (x) { return x && x.id === id; })[0] || null;
        }
        el.appendChild(UI.makeCard(c));
      });
    }
  };

  /* The challenger's buttons, in a full-width row under the status. */
  DonkeyTable.prototype.renderChoices = function (v) {
    var d = v.tiebreak && v.tiebreak.duel, me = this.me, self = this;
    var html = '';
    if (d && v.canChallenge) {
      html = d.players.filter(function (pid) { return pid !== me; }).map(function (pid) {
        return '<button class="btn btn-ghost" type="button" data-target="' + pid + '">Challenge ' + self.name(pid) + '</button>';
      }).join('');
    } else if (d && v.canCall) {
      html = '<button class="btn btn-ghost" type="button" data-call="lower">Lower</button>' +
        '<button class="btn btn-ghost" type="button" data-call="equal">Equal</button>' +
        '<button class="btn btn-ghost" type="button" data-call="higher">Higher</button>';
    }
    if (this.el.choices.dataset.html !== html) {
      this.el.choices.dataset.html = html;
      this.el.choices.innerHTML = html;
    }
    this.el.choices.hidden = !html;
  };

  DonkeyTable.prototype.lettersWord = function (v, pid) {
    var p = this.player(v, pid);
    if (!p || !p.letters) return 'no letters';
    return p.letters === 1 ? '1 letter' : p.letters + ' letters';
  };

  DonkeyTable.prototype.statusFor = function (v) {
    var me = this.me, self = this;
    var timer = ' <span class="secs"></span>';
    var four = v.myFour ? 'four ' + RANKS[v.myFour] : '';
    switch (v.phase) {
      case 'dealing':
        return { main: 'Round ' + v.round + ' · dealing…', sub: (v.starter === me ? 'You start' : this.name(v.starter) + ' starts') + ' the passing.' };
      case 'pass': {
        var to = this.name(this.nextOf(v, v.turn));
        if (v.canDeclare) return { main: '<span class="hl">You have ' + four + '!</span> Put them down.', sub: 'Tap Four of a kind before anyone else gets there.' };
        if (v.canPass) return { main: '<span class="hl">Your turn.</span> Pass a card to ' + to + '.' + timer, sub: 'Keep the cards you’re collecting. Tap a card, then tap it again.' };
        return { main: this.name(v.turn) + ' is passing to ' + (to === 'You' ? 'you' : to) + '…', sub: 'Watch for four of a kind, and be quick to put your cards down.' };
      }
      case 'declared':
        return { main: (v.declare.player === me ? 'You put down four ' : this.name(v.declare.player) + ' has four ') + RANKS[v.declare.rank] + '!', sub: v.declare.player === me ? 'You’re safe this round.' : 'Get ready…' };
      case 'race': {
        var mine = this.raceEntry(v, me);
        var waiting = v.race.racers.filter(function (pid) { return !self.raceEntry(v, pid); }).map(function (pid) { return self.lname(pid); });
        if (v.canReact) return { main: '<span class="hl">Put your cards down!</span>', sub: 'The last one gets a letter.' };
        if (v.declare.player === me) return { main: 'You’re safe. Who’s slowest?', sub: waiting.length ? 'Waiting for ' + list(waiting) + '.' : '' };
        if (mine) return { main: 'Down in ' + secs(mine.ms) + '.', sub: waiting.length ? 'Waiting for ' + list(waiting) + '.' : '' };
        return { main: '', sub: '' };
      }
      case 'roundEnd': {
        var r = v.result;
        var who = r.losers.map(function (pid) { return self.lname(pid); });
        var gets = r.losers.map(function (pid) {
          var p = self.player(v, pid);
          return v.word.charAt(p.letters - 1);
        });
        var iLost = r.losers.indexOf(me) >= 0;
        var main;
        if (r.losers.length === 1) {
          main = iLost
            ? '<span class="em">You were ' + (r.late.length ? 'too slow' : 'last') + '.</span> You get ' + an(gets[0]) + ' ' + gets[0] + '.'
            : this.name(r.losers[0]) + ' was ' + (r.late.length ? 'too slow' : 'last') + ' and gets ' + an(gets[0]) + ' ' + gets[0] + '.';
        } else {
          main = list(who) + ' never put their cards down: a letter each.';
        }
        var times = r.order.map(function (o) { return self.name(o.player) + ' ' + secs(o.ms); }).join(' · ');
        var anyDonkey = v.players.some(function (p) { return p.letters >= v.word.length; });
        return { main: main, sub: anyDonkey ? 'That spells DONKEY. Game over!' : times };
      }
      case 'tiebreak': {
        var d = v.tiebreak.duel;
        if (!d) return { main: 'Tie-breaker', sub: '' };
        var opp = d.opponent ? this.lname(d.opponent) : '';
        if (d.step === 'choose') {
          if (v.canChallenge) return { main: '<span class="hl">You’re the challenger.</span> Pick who to duel.' + timer, sub: 'You’ll each draw a card from a full deck.' };
          return { main: this.name(d.challenger) + ' is picking who to challenge…', sub: 'Tied players settle their places with a duel.' };
        }
        if (d.step === 'call') {
          var my = d.myCard ? UI.cardText(d.myCard) : '';
          if (v.canCall) return { main: 'Your card is ' + my + '. Is it lower, equal or higher than ' + opp + '’s?' + timer, sub: 'A right call knocks ' + opp + ' out; a wrong one knocks you out. Aces are high.' };
          if (d.opponent === me) return { main: this.name(d.challenger) + ' is making the call…', sub: 'Your card is ' + my + '.' };
          return { main: this.name(d.challenger) + ' is making the call against ' + opp + '…', sub: '' };
        }
        var res = d.result;
        return {
          main: (d.challenger === me ? 'You' : this.name(d.challenger)) + ' called ' + d.call + ': ' + (res.right ? 'right' : 'wrong') + '.',
          sub: (res.out === me ? 'You take ' : this.name(res.out) + ' takes ') + PLACES[res.place] + ' place.'
        };
      }
      case 'over': {
        var w = v.winners && v.winners[0];
        return { main: w === me ? '<span class="hl">You win!</span>' : this.name(w) + ' wins.', sub: 'Fewest letters when DONKEY was spelled.' };
      }
    }
    return { main: '', sub: '' };
  };

  DonkeyTable.prototype.renderStatus = function (v) {
    var st = this.statusFor(v);
    this.el.statusMain.innerHTML = st.main;
    this.el.statusSub.innerHTML = st.sub || '';
  };

  DonkeyTable.prototype.renderMe = function (v) {
    this.el.declare.hidden = !v.canDeclare;
    var sel = v.canPass && this.selected ? v.hand.filter(function (c) { return c.id === this.selected; }, this)[0] : null;
    if (sel && !v.canDeclare) {
      this.el.pass.hidden = false;
      this.el.pass.innerHTML = 'Pass ' + sel.rank + UI.suitSvg(sel.suit);
      this.el.pass.setAttribute('aria-label', 'Pass the ' + CT.cardName(sel));
    } else {
      this.el.pass.hidden = true;
    }
    this.el.slap.hidden = !v.canReact;
    if (v.canReact) {
      var key = v.round + ':' + (v.race && v.race.startAt);
      if (this.slapKey !== key) { this.slapKey = key; this.slapHops = 0; this.placeSlap(); }
    }
    this.el.handWrap.classList.toggle('is-down', !!this.raceEntry(v, this.me) && (v.phase === 'race' || v.phase === 'roundEnd'));
  };

  DonkeyTable.prototype.renderHand = function (v) {
    var cards = sortHand(v.hand);
    var self = this;
    if (this.selected && !v.hand.some(function (c) { return c.id === self.selected; })) this.selected = null;
    if (!v.canPass) this.selected = null;
    var keep = {};
    var fourRank = v.myFour;
    cards.forEach(function (c, i) {
      keep[c.id] = true;
      var el = self.handEls[c.id];
      if (!el) {
        el = UI.makeCard(c, 'button');
        el.type = 'button';
        el.classList.add('hcard');
        el.dataset.id = c.id;
        if (!self.first && !self.hidden['h:' + c.id]) el.classList.add('new');
        self.el.hand.appendChild(el);
        self.handEls[c.id] = el;
      }
      el.classList.toggle('playable', !!v.canPass && !v.canDeclare);
      el.classList.toggle('four', !!fourRank && c.rank === fourRank);
      el.classList.toggle('selected', self.selected === c.id);
      el.classList.remove('dim');
      el.style.visibility = self.hidden['h:' + c.id] ? 'hidden' : '';
      el.style.zIndex = String(i + 1);
    });
    for (var id in this.handEls) {
      if (!keep[id]) { this.handEls[id].parentNode.removeChild(this.handEls[id]); delete this.handEls[id]; }
    }
    this.layoutHand(cards);
  };

  DonkeyTable.prototype.layoutHand = function (cards) {
    var wrap = this.el.handWrap;
    var cs = getComputedStyle(wrap);
    var W = wrap.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    var cw = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--hcw')) || 58;
    var n = cards.length;
    var step = n > 1 ? Math.min(cw + 8, (W - cw) / (n - 1)) : 0;
    var total = n ? (n - 1) * step + cw : 0;
    var offset = Math.max(0, (W - total) / 2);
    this.el.hand.style.width = W + 'px';
    var self = this;
    cards.forEach(function (c, i) {
      var el = self.handEls[c.id];
      if (el) el.style.left = (offset + i * step) + 'px';
    });
  };

  /* ~20×/s from the app loop: pass and tie-breaker countdowns. */
  DonkeyTable.prototype.frame = function () {
    var v = this.v;
    if (!v) return;
    var now = this.session.now();
    var self = this;
    var endsAt = null, total = 0, who = null;
    if (v.phase === 'pass' && v.turnEndsAt) { endsAt = v.turnEndsAt; total = v.timing.passMs; who = v.turn; }
    if (v.phase === 'tiebreak' && v.tiebreak.duel && v.tiebreak.duel.step !== 'reveal') {
      endsAt = v.tiebreak.duel.endsAt; total = v.timing.duelChoiceMs; who = v.tiebreak.duel.challenger;
    }

/* ==========================================================================
   GAME MODE · BULL — table screen
   A round table: you at the bottom, everyone else round the circle
   clockwise from your left. The face-down pile sits in the middle under the
   rank that's due next. Pick one to four cards and play them as that rank;
   when someone else plays, the Bull! button is yours until the next player
   has gone. Everything drawn comes from session.view(me), so nothing hidden
   can leak onto the screen.

(function (CT) {
  'use strict';
  var UI = CT.UI;

  var RANKS = Bull.ranks;
  var PAINTS = ['#F4B942', '#F0643C', '#7FD1C1', '#9CC9EE', '#EBDDBB', '#C9A8F0'];
  var SUIT_ORDER = { S: 0, H: 1, C: 2, D: 3 };
  var NUM = ['no', 'one', 'two', 'three', 'four'];
  var RING = 113.1;   // circumference of the avatar timer ring (r = 18)
  var EXPOSE_MS = 3600;   // a bluff nobody called stays turned over on the pile this long

    return hand.slice().sort(function (a, b) {

    });

  function article(rank) { return rank === 'A' || rank === '8' ? 'an' : 'a'; }

  function claim(rank, n) { return n === 1 ? article(rank) + ' ' + Bull.rankName(rank, 1) : NUM[n] + ' ' + plural(rank); }
  /* After "Mia’s" or "your": "Mia’s 7", "your two 7s". */
  function owned(rank, n) { return n === 1 ? Bull.rankName(rank, 1) : NUM[n] + ' ' + plural(rank); }

  function avatarHtml(initial) {
    return '<span class="dk-avatar"><svg class="dk-ring" viewBox="0 0 40 40" aria-hidden="true" hidden>' +
      '<circle class="bg" cx="20" cy="20" r="18"/><circle class="fg" cx="20" cy="20" r="18" stroke-dasharray="' + RING + '" stroke-dashoffset="0"/></svg>' +
      '<span class="dk-initial">' + UI.esc(initial) + '</span></span>';

  function BullTable(app, session, me, opts) {

    this.session = session;
    this.me = me;

    this.selected = [];
    this.hidden = {};

    this.seatEls = {};
    this.logItems = [];

  BullTable.prototype.name = function (pid) {

  /* "Mia’s" or "your" */
  BullTable.prototype.poss = function (pid) { return pid === this.me ? 'your' : this.name(pid) + '’s'; };

  BullTable.prototype.spot = function (v, pid) {

  /* ---------- static layout ---------- */

  BullTable.prototype.build = function () {

    var self = this;
    this.root.innerHTML =
      '<header class="topbar">' +
        '<button class="icon-btn" id="b-menu" type="button" aria-label="Game menu">' + UI.icon.menu + '</button>' +
        '<span class="wordmark">BULL</span>' +
        '<span class="spacer"></span>' +
        '<button class="icon-btn" id="b-music" type="button"></button>' +
        '<button class="icon-btn" id="b-sound" type="button"></button>' +
      '</header>' +
      '<div class="bl-table" id="b-table">' +
        '<div class="bl-felt" aria-hidden="true"></div>' +
        '<div class="bl-center" id="b-center">' +
          // the last play, big: who played, and what they claim it is
          '<div class="bl-claim" id="b-claim" aria-live="polite" style="visibility:hidden"><span class="who" id="b-claim-who">·</span><b class="what" id="b-claim-what">·</b></div>' +
          '<div class="bl-pile" id="b-pile" aria-hidden="true"><span class="card back"></span><span class="card back"></span><span class="card back"></span>' +
            // a bluff nobody called, turned over on the pile for a moment (a rule choice)
            '<div class="bl-exposed" id="b-exposed" hidden></div></div>' +
          '<p class="bl-pilecount" id="b-pilecount"></p>' +
          // the rank that must be claimed next: the rank alone on a tile, and who has to play it
          '<div class="bl-now" id="b-now"><b class="bl-rank" id="b-rank"></b>' +
            '<span class="bl-now-text"><span class="lbl">Next rank</span><span class="bl-turn" id="b-turn"></span></span></div>' +
          '<div class="bl-reveal" id="b-reveal" hidden></div>' +
        '</div>' +
      '</div>' +
      '<div class="status" id="b-status" aria-live="polite"><p class="status-main"></p><p class="status-sub"></p></div>' +
      '<div class="bl-me" id="b-me">' +
        '<div class="bl-me-info">' + avatarHtml('Y') + '<div class="bl-me-text"><span class="me-name">You</span><span class="me-count" id="b-mecount"></span></div></div>' +
        '<div class="bl-actions">' +
          '<button class="btn bl-bull" id="b-bull" type="button" hidden>Bull!</button>' +
          '<button class="btn btn-primary btn-play" id="b-play" type="button" hidden></button>' +
        '</div>' +
      '</div>' +
      '<div class="hand-wrap bl-handwrap" id="b-handwrap"><div class="hand" id="b-hand"></div></div>';

    var table = this.root.querySelector('#b-table');
    v.players.forEach(function (p, i) {
      if (p.id === self.me) return;
      var at = self.spot(v, p.id);
      var seat = document.createElement('div');
      seat.className = 'bl-seat';
      seat.dataset.pid = p.id;
      seat.style.left = (at.x * 100) + '%';
      seat.style.top = (at.y * 100) + '%';
      seat.style.setProperty('--paint', PAINTS[i % PAINTS.length]);
      seat.innerHTML = avatarHtml(p.name.charAt(0)) +
        '<span class="seat-name">' + UI.esc(p.name) + '</span>' +
        '<span class="bl-count"><span class="card back" aria-hidden="true"></span><b></b></span>' +
        '<span class="bl-bubble" style="visibility:hidden">·</span>';
      table.appendChild(seat);
      self.seatEls[p.id] = {
        seat: seat,
        ring: seat.querySelector('.dk-ring'),
        ringFg: seat.querySelector('.dk-ring .fg'),
        count: seat.querySelector('.bl-count b'),
        stack: seat.querySelector('.bl-count .card'),
        bubble: seat.querySelector('.bl-bubble')
      };
    });
    var meEl = this.root.querySelector('#b-me');
    this.seatEls[this.me] = { seat: meEl, ring: meEl.querySelector('.dk-ring'), ringFg: meEl.querySelector('.dk-ring .fg') };

    this.el = {
      music: this.root.querySelector('#b-music'),
      sound: this.root.querySelector('#b-sound'),
      center: this.root.querySelector('#b-center'),
      claim: this.root.querySelector('#b-claim'),
      claimWho: this.root.querySelector('#b-claim-who'),
      claimWhat: this.root.querySelector('#b-claim-what'),
      rank: this.root.querySelector('#b-rank'),
      turn: this.root.querySelector('#b-turn'),
      now: this.root.querySelector('#b-now'),
      pile: this.root.querySelector('#b-pile'),
      exposed: this.root.querySelector('#b-exposed'),
      pileCount: this.root.querySelector('#b-pilecount'),
      reveal: this.root.querySelector('#b-reveal'),
      statusMain: this.root.querySelector('#b-status .status-main'),
      statusSub: this.root.querySelector('#b-status .status-sub'),
      meCount: this.root.querySelector('#b-mecount'),
      meAvatar: this.root.querySelector('#b-me .dk-avatar'),
      bull: this.root.querySelector('#b-bull'),
      play: this.root.querySelector('#b-play'),
      handWrap: this.root.querySelector('#b-handwrap'),

  BullTable.prototype.renderAudio = function () {
    var m = UI.Music.on, s = UI.Sound.on;

    this.el.music.setAttribute('aria-label', m ? 'Music on. Tap to turn it off.' : 'Music off. Tap to turn it on.');

    this.v = v;

    var plan = (!this.quiet && events.length) ? this.plan(events, pre, v) : { flights: [] };
    this.render(v);
    if (plan.flights.length) this.run(plan);

  BullTable.prototype.plan = function (events, pre, v) {
    var me = this.me, self = this;
    var flights = [];
    function add(f) { if (f.hide) self.hide(f.hide); flights.push(f); }
    events.forEach(function (e) {
      if (e.type === 'deal') {
        var mine = e.mine ? sortHand(e.mine.hand) : [];
        var gap = Math.min(45, 1100 / Math.max(1, mine.length));
        mine.forEach(function (c, i) {
          add({ from: 'pile', to: 'h:' + c.id, card: c, delay: 120 + i * gap, duration: 300, hide: 'h:' + c.id, sound: i % 2 ? null : 'deal' });
        });

          if (pid === me) return;

        });

        var cards = e.player === me && e.mine ? e.mine.cards : null;
        for (var i = 0; i < e.n; i++) {
          var c = cards ? cards[i] : null;

        }
      } else if (e.type === 'pickup') {
        if (e.player === me && e.mine) {

          });

  BullTable.prototype.target = function (key) {

      if (f.sound) setTimeout(function () { UI.Sound.play(f.sound); }, f.delay || 0);

  BullTable.prototype.render = function (v) {

  };

  /* A bluff nobody called is showing on the pile (for a few seconds after it was turned over). */

  BullTable.prototype.renderSeats = function (v) {

      var s = self.seatEls[p.id];

      else if (r && r.accused === p.id) { say = r.lie ? 'Caught!' : 'True!'; tone = r.lie ? 'ember' : 'ok'; }
      else if (x && x.by === p.id) { say = 'Bluffed!'; tone = 'ember'; }
      else if (v.phase === 'over' && v.winners && v.winners[0] === p.id) { say = 'Out!'; tone = 'ok'; }

    });
  };

  BullTable.prototype.renderCenter = function (v) {
    var r = v.reveal;
    var showReveal = v.phase === 'reveal' && r;
    this.el.center.classList.toggle('revealing', !!showReveal);
    this.el.reveal.hidden = !showReveal;
    this.renderClaim(v);
    // the rank to claim next, on its own ("5", not "5s"), and who has to play it
    var mine = v.phase === 'play' && v.turn === this.me;
    var turnText = mine ? 'Your turn: play ' + plural(v.rank)
      : v.turn ? this.name(v.turn) + ' must play ' + plural(v.rank) : '';

    this.el.rank.setAttribute('aria-label', plural(v.rank));
    if (this.el.turn.innerHTML !== turnText) this.el.turn.innerHTML = turnText;
    this.el.now.classList.toggle('mine', mine);

    for (var i = 0; i < backs.length; i++) backs[i].style.visibility = i < shown ? '' : 'hidden';

    var x = this.exposureLive(v) ? v.exposure : null;
    this.el.exposed.hidden = !x;
    if (x && this.el.exposed.dataset.key !== String(x.no)) {
      // labelled with whose claim it was, so it isn't read as the play just above it
      this.el.exposed.dataset.key = String(x.no);
      this.el.exposed.innerHTML = '<p class="bl-exposed-head">' + this.poss(x.by).replace(/^your/, 'Your') + ' ' + owned(x.rank, x.n) + '</p><div class="bl-exposed-cards"></div>';
      var row = this.el.exposed.querySelector('.bl-exposed-cards');

    var row = this.el.reveal.querySelector('.bl-reveal-cards');

  };

  BullTable.prototype.renderClaim = function (v) {

  BullTable.prototype.statusFor = function (v) {
    var me = this.me, self = this;

    switch (v.phase) {
      case 'dealing':
        return { main: 'Dealing the whole deck…', sub: (v.starter === me ? 'You start' : this.name(v.starter) + ' starts') + ' with Aces.' };
      case 'play': {
        var want = plural(v.rank);
        if (v.turn === me) {
          var have = v.hand.filter(function (c) { return c.rank === v.rank; }).length;
          var waiting = v.openAt != null && this.session.now() < v.openAt && last;
          var picked = this.selected.length && this.selected.every(function (id) { return v.hand.some(function (c) { return c.id === id && c.rank === v.rank; }); }) && this.selected.length === Math.min(4, have);
          var pick = have && !picked ? ' <button class="link-btn bl-pick" id="b-pick" type="button">Pick ' + (have === 1 ? 'it' : 'them') + '</button>' : '';
          var sub = waiting
            ? 'Everyone has a moment to call Bull on ' + this.poss(last.by) + ' ' + owned(last.rank, last.n) + '.'
            : have ? 'You have ' + NUM[have] + ' ' + Bull.rankName(v.rank, have) + '.' + pick
              : 'You have no ' + want + ', so you’ll have to bluff.';
          return { main: '<span class="hl">Your turn:</span> play ' + want + '.' + timer, sub: sub };
        }
        var main = this.name(v.turn) + ' is playing ' + want + '…';
        if (v.canBull && last) {
          var q = last.n === 1 ? 'Is ' + this.poss(last.by) + ' card really ' + claim(last.rank, 1) : 'Are ' + this.poss(last.by) + ' cards really ' + claim(last.rank, last.n);
          return { main: main, sub: q + '? If not, call Bull before ' + this.lname(v.turn) + ' plays.' };
        }
        if (last && last.by === me) return { main: main, sub: 'You played ' + claim(last.rank, last.n) + '. Will anyone call Bull?' };
        return { main: main, sub: '' };
      }
      case 'lastcall':
        if (last.by === me) return { main: 'That was your last card! <span class="hl">Will anyone call Bull?</span>', sub: 'If nobody does, you win.' };
        return { main: '<span class="hl">' + this.name(last.by) + ' played their last ' + (last.n === 1 ? 'card' : 'cards') + '!</span>' + timer, sub: 'Call Bull now, or ' + this.name(last.by) + ' wins.' };
      case 'reveal': {
        var who = r.challenger === me ? 'You called' : this.name(r.challenger) + ' called';
        var taker = r.taker === me ? 'You pick up ' : this.name(r.taker) + ' picks up ';
        var main = r.lie
          ? '<span class="em">Bluff!</span> ' + taker + cardsWord(r.count) + '.'
          : '<span class="hl">True!</span> ' + taker + cardsWord(r.count) + '.';
        var sub = who + ' Bull on ' + this.poss(r.accused) + ' ' + owned(r.rank, r.n) + ': ' + r.cards.map(UI.cardText).join(' ');
        if (r.wasLast && !r.lie) sub = this.name(r.accused) + (r.accused === me ? ' were' : ' was') + ' telling the truth with ' + (r.accused === me ? 'your' : 'their') + ' last cards.';
        return { main: main, sub: sub };
      }
      case 'over': {
        var w = v.winners && v.winners[0];
        return { main: w === me ? '<span class="hl">You win!</span>' : this.name(w) + ' wins.', sub: (w === me ? 'You' : this.name(w)) + ' got rid of every card.' };
      }
    }
    return { main: '', sub: '' };
  };

  BullTable.prototype.renderStatus = function (v) {
    var st = this.statusFor(v);
    if (this.statusHtml === st.main + '|' + st.sub) return;
    this.statusHtml = st.main + '|' + st.sub;
    this.el.statusMain.innerHTML = st.main;
    this.el.statusSub.innerHTML = st.sub || '';
    var self = this, pick = this.el.statusSub.querySelector('#b-pick');
    if (pick) pick.addEventListener('click', function () { self.pickRank(); });
  };

  BullTable.prototype.renderMe = function (v) {
    var mine = this.player(v, this.me);
    this.el.meCount.textContent = mine ? cardsWord(mine.handCount) : '';
    this.el.bull.hidden = !v.canBull;
    if (v.canBull && v.last) this.el.bull.setAttribute('aria-label', 'Call Bull on ' + this.poss(v.last.by) + ' ' + owned(v.last.rank, v.last.n));
    var n = this.selected.length;
    this.el.play.hidden = !(v.canPlay && n);
    if (v.canPlay && n) {
      this.el.play.innerHTML = 'Play ' + n + '<span class="as"> as ' + (n === 1 ? article(v.rank) + ' ' + Bull.rankName(v.rank, 1) : plural(v.rank)) + '</span>';
      this.el.play.setAttribute('aria-label', 'Play ' + n + ' as ' + claim(v.rank, n).replace(/^(one|two|three|four) /, ''));
      this.updatePlayWait();
    }
  };

  /* Play waits until everyone has had their moment to call Bull. */
  BullTable.prototype.updatePlayWait = function () {
    var v = this.v;
    if (!v || this.el.play.hidden) return;
    var wait = v.openAt != null ? v.openAt - this.session.now() : 0;
    var waiting = wait > 0;
    this.el.play.disabled = waiting;
    this.el.play.classList.toggle('waiting', waiting);
  };

  BullTable.prototype.renderHand = function (v) {
    var cards = sortHand(v.hand);
    var self = this;
    this.selected = this.selected.filter(function (id) { return v.hand.some(function (c) { return c.id === id; }); });
    var keep = {};
    cards.forEach(function (c, i) {
      keep[c.id] = true;
      var el = self.handEls[c.id];
      if (!el) {
        el = UI.makeCard(c, 'button');
        el.type = 'button';
        el.classList.add('hcard');
        el.dataset.id = c.id;
        if (!self.first && !self.hidden['h:' + c.id]) el.classList.add('new');
        self.el.hand.appendChild(el);
        self.handEls[c.id] = el;
      }
      el.classList.toggle('playable', !!v.canPlay && c.rank === v.rank);
      el.classList.toggle('selected', self.selected.indexOf(c.id) >= 0);
      el.style.visibility = self.hidden['h:' + c.id] ? 'hidden' : '';
    });
    for (var id in this.handEls) {
      if (!keep[id]) { this.handEls[id].parentNode.removeChild(this.handEls[id]); delete this.handEls[id]; }
    }
    this.layoutHand(cards);
  };

  /* One row while the cards fit; two overlapping rows for a big hand. */
  BullTable.prototype.layoutHand = function (cards) {
    var wrap = this.el.handWrap;
    var cs = getComputedStyle(wrap);
    var W = wrap.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    var cw = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--hcw')) || 58;
    var n = cards.length;
    var two = n > 1 && (W - cw) / (n - 1) < cw * 0.36;
    wrap.classList.toggle('two', two);
    this.el.hand.style.width = W + 'px';
    var rows = two ? [cards.slice(0, Math.ceil(n / 2)), cards.slice(Math.ceil(n / 2))] : [cards];
    var lift = cw * 1.4 * 0.56;
    var self = this;
    rows.forEach(function (row, ri) {
      var m = row.length;
      var step = m > 1 ? Math.min(cw + 8, (W - cw) / (m - 1)) : 0;
      var total = m ? (m - 1) * step + cw : 0;
      var offset = Math.max(0, (W - total) / 2);
      row.forEach(function (c, i) {
        var el = self.handEls[c.id];
        if (!el) return;
        el.style.left = (offset + i * step) + 'px';
        el.style.bottom = (two && ri === 0 ? lift + 4 : 4) + 'px';
        el.style.zIndex = String(ri * 100 + i + 1);   // a picked card rises, but never covers its neighbours
      });
    });
  };

  /* ~20×/s from the app loop: turn timers, and Play waiting for Bull calls. */
  BullTable.prototype.frame = function () {
    var v = this.v;
    if (!v) return;
    var now = this.session.now();
    var self = this;
    // a revealed bluff has had its moment on the pile
    var live = this.exposureLive(v);
    if (live !== !!this.exposedShown) { this.exposedShown = live; this.renderCenter(v); this.renderSeats(v); }
    var who = null, endsAt = null, total = 0;
    if (v.phase === 'play' && v.turnEndsAt && (v.openAt == null || now >= v.openAt)) { who = v.turn; endsAt = v.turnEndsAt; total = v.timing.turnMs; }
    if (v.phase === 'lastcall' && v.last) { who = v.last.by; endsAt = v.phaseEndsAt; total = v.timing.lastCallMs; }
    Object.keys(this.seatEls).forEach(function (pid) {
      var s = self.seatEls[pid];
      if (!s.ring) return;
      if (pid === who && endsAt) {
        s.ring.removeAttribute('hidden');
        var left = Math.max(0, endsAt - now);
        s.ringFg.setAttribute('stroke-dashoffset', String(RING * (1 - (total ? left / total : 0))));
        s.ring.classList.toggle('urgent', left <= 5000);
      } else s.ring.setAttribute('hidden', '');
    });
    var span = this.el.statusMain.querySelector('.secs');
    var mineToWatch = (who === this.me && v.phase === 'play') || v.phase === 'lastcall';
    if (span && endsAt && mineToWatch) {
      var left = Math.max(0, endsAt - now);
      var sec = Math.ceil(left / 1000);
      span.textContent = (v.phase === 'lastcall' || left <= 10000) ? '· ' + sec + 's' : '';
      if (sec !== this.lastSecs) {
        this.lastSecs = sec;
        if (v.phase === 'play' && left <= 5000 && sec > 0) UI.Sound.play('tick');
      }
    } else if (span) span.textContent = '';
    // the waiting moment ends: Play comes alive, and the hint changes
    var waiting = v.phase === 'play' && v.turn === this.me && v.openAt != null && now < v.openAt;
    if (waiting !== this.wasWaiting) { this.wasWaiting = waiting; this.renderStatus(v); }
    this.updatePlayWait();
  };

  /* ---------- input ---------- */

  BullTable.prototype.tapCard = function (id, el) {
    var v = this.v;
    if (!v) return;
    UI.Sound.unlock();
    var i = this.selected.indexOf(id);
    if (i >= 0) this.selected.splice(i, 1);
    else if (this.selected.length >= Bull.maxPlay) {
      this.shake(el);
      UI.toast('You can play up to four cards at a time.');
      return;
    } else this.selected.push(id);
    UI.buzz(8);
    this.renderHand(v);
    this.renderMe(v);
    this.renderStatus(v);
  };

  BullTable.prototype.pickRank = function () {
    var v = this.v;
    if (!v) return;
    this.selected = v.hand.filter(function (c) { return c.rank === v.rank; }).slice(0, 4).map(function (c) { return c.id; });
    UI.buzz(8);
    this.renderHand(v);
    this.renderMe(v);
    this.renderStatus(v);
  };

  BullTable.prototype.shake = function (el) {
    if (!el) return;
    el.classList.remove('shake');
    void el.offsetWidth;
    el.classList.add('shake');
  };

  /* A move. At this table the answer is immediate; at an online table it
     comes back from the server a moment later, and further taps wait for it. */
  BullTable.prototype.send = function (type, payload, then) {
    if (this.sending) return;
    var self = this;
    this.sending = true;
    var finish = function (res) { self.sending = false; if (then) then(res); };
    var res = this.session.act(this.me, type, payload, finish);
    if (!res || !res.pending) finish(res);
  };

  BullTable.prototype.play = function () {
    var v = this.v, self = this;
    if (!v || !v.canPlay || !this.selected.length) return;
    UI.Sound.unlock();
    this.send('play', { cardIds: this.selected.slice() }, function (res) {
      if (!res.ok) {
        if (res.code !== 'wait') UI.toast(UI.esc(res.message));
        UI.Sound.play('nope');
        return;
      }
      self.selected = [];
      UI.buzz(10);
    });
  };

  BullTable.prototype.callBull = function () {
    var v = this.v;
    if (!v || !v.canBull || !v.last) return;
    UI.Sound.unlock();
    var key = v.last.no;
    if (this.called === key) return;
    this.called = key;
    UI.Sound.play('bull');
    UI.buzz(30);
    var self = this;
    this.send('bull', {}, function (res) {
      if (!res.ok) {
        if (res.code === 'offline') self.called = null;
        else if (res.code === 'phase' || res.code === 'nothing') UI.toast('Too late: ' + UI.esc(res.message.charAt(0).toLowerCase() + res.message.slice(1)));
      }
    });
  };

  /* ---------- sounds and notices ---------- */

  BullTable.prototype.react = function (events, v) {
    var me = this.me;
    events.forEach(function (e) {
      switch (e.type) {
        case 'play':
          UI.Sound.play(e.player === me ? 'play' : 'deal');
          break;
        case 'bull':
          if (e.challenger !== me) UI.Sound.play('bull');
          setTimeout(function () { UI.Sound.play('flip'); }, 420);
          if (e.accused === me || e.challenger === me) UI.buzz(e.taker === me ? 60 : 15);
          break;
        case 'pickup':
          setTimeout(function () { UI.Sound.play(e.player === me ? 'lose' : 'draw'); }, 120);
          break;
        case 'lastCall':
          UI.Sound.play('alert');
          break;
        case 'lieExposed':
          setTimeout(function () { UI.Sound.play('flip'); }, 150);
          break;
        case 'timeout':
          if (e.player === me) { UI.toast('Time’s up. A card was played for you.'); UI.Sound.play('nope'); }
          break;
        case 'gameOver':
          setTimeout(function () { UI.Sound.play(e.winners.indexOf(me) >= 0 ? 'victory' : 'lose'); }, 700);
          break;
      }
    });
  };

  /* ---------- play-by-play ---------- */

  BullTable.prototype.pushLog = function (html, cls) {
    var item = { html: html, cls: cls || '' };
    this.logItems.push(item);
    if (this.logItems.length > 600) this.logItems.shift();
    return item;
  };

  BullTable.prototype.logEvent = function (e, v) {
    var me = this.me, self = this;
    var N = function (pid) { return self.name(pid); };
    switch (e.type) {
      case 'deal':
        this.pushLog('The whole deck is dealt. ' + (e.starter === me ? 'You start' : N(e.starter) + ' starts') + ' with Aces.', 'set');
        if (e.mine) this.pushLog('Your hand: ' + sortHand(e.mine.hand).map(UI.cardText).join(' '));
        break;
      case 'play': {
        var text = (e.player === me ? 'You played ' : N(e.player) + ' played ') + claim(e.rank, e.n);
        if (e.player === me && e.mine) {
          var bluff = e.mine.cards.some(function (c) { return c.rank !== e.rank; });
          text += ': ' + e.mine.cards.map(UI.cardText).join(' ') + (bluff ? ' (a bluff)' : '');
        }
        this.pushLog(text + (e.auto ? ' (time ran out)' : '') + '.');
        break;
      }
      case 'bull':
        this.pushLog((e.challenger === me ? 'You' : N(e.challenger)) + ' called Bull on ' + this.poss(e.accused) + ' ' + owned(e.rank, e.n) + ': ' +
          e.cards.map(UI.cardText).join(' ') + '. ' + (e.lie ? 'A bluff!' : 'True!'), 'win');
        break;
      case 'pickup':
        this.pushLog((e.player === me ? 'You pick up ' : N(e.player) + ' picks up ') + cardsWord(e.count) + '.');
        break;
      case 'lastCall':
        this.pushLog((e.player === me ? 'You' : N(e.player)) + ' played ' + (e.player === me ? 'your' : 'their') + ' last cards. Last chance to call Bull!', 'set');
        break;
      case 'lieExposed':
        this.pushLog((e.player === me ? 'Your bluff got past everyone: your ' : N(e.player) + ' got away with a bluff: ' + this.poss(e.player) + ' ') +
          owned(e.rank, e.n) + (e.n === 1 ? ' was ' : ' were ') + e.cards.map(UI.cardText).join(' ') + (e.final ? ', and it won the game.' : '.'), 'set');
        break;
      case 'gameOver':
        this.pushLog((e.winners[0] === me ? 'You win' : N(e.winners[0]) + ' wins') + ': no cards left.', 'win');
        break;
    }
  };

  /* ---------- end of game ---------- */

  BullTable.prototype.result = function (v) {
    var me = this.me, self = this;
    var w = v.winners && v.winners[0];
    var order = v.players.slice().sort(function (a, b) { return a.handCount - b.handCount; });
    var rows = order.map(function (p) {
      var idx = v.players.indexOf(p);
      var paint = p.id === me ? 'var(--ink)' : PAINTS[idx % PAINTS.length];
      var nm = p.id === me ? 'You' : UI.esc(p.name);
      return '<li class="' + (p.id === w ? 'champ' : '') + '"><span class="avatar" style="--paint:' + paint + '">' + UI.esc(nm.charAt(0)) + '</span>' +
        '<span>' + nm + '</span><span class="left">' + (p.handCount ? cardsWord(p.handCount) + ' left' : 'out') + '</span></li>';
    }).join('');
    // won with a bluff nobody called, turned over at the end (the "lies" rule choice)
    var x = v.exposure && v.exposure.final && v.exposure.by === w ? v.exposure : null;
    var bluff = x ? ', with a bluff nobody called: ' + this.poss(w) + ' ' + owned(x.rank, x.n) + (x.n === 1 ? ' was ' : ' were ') +
      x.cards.map(UI.cardText).join(' ') + '!' : '.';
    return {
      why: (w === me ? 'You' : this.name(w)) + ' got rid of every card first' + bluff,
      body: '<div class="standings"><ul>' + rows + '</ul></div>'
    };
  };

  CT.UI.presenters = CT.UI.presenters || {};
  CT.UI.presenters.bull = BullTable;
})(window.CT);

   GAME MODE · BULL — interactive tutorial
   Five short lessons on the real table, with small hand-arranged hands so
   they're quick, and scripted computer players (Mia on your left, Dex
   across, Rae on your right) who play and call Bull exactly as written. The
   steps run on the shared lesson runner (src/ui/tutorial.js). Nothing is

(function (CT) {
  'use strict';
  var UI = CT.UI;
  var Bull = CT.getMode('bull');
  var RANKS = Bull.ranks;

  function C(id) { return { id: id, rank: id.slice(0, -1), suit: id.slice(-1) }; }
  function K(id) { return UI.cardText(C(id)); }

  var PLAYERS = [
    { id: 'p0', name: 'You', isBot: false },
    { id: 'p1', name: 'Mia', isBot: true },
    { id: 'p2', name: 'Dex', isBot: true },
    { id: 'p3', name: 'Rae', isBot: true }
  ];
  // No time limit to play; two seconds to call Bull after each play.
  var TIMING = { dealHoldMs: 0, turnMs: 0, bullMs: 2000, revealMs: 3200, lastCallExtraMs: 1500 };

  /* ---------- helpers the lessons use ---------- */

  }

  function called(ctx) { return saw(ctx, 'bull'); }
  function pickedUp(ctx) { return saw(ctx, 'pickup'); }
  function count(ctx, pid) {
    var p = ctx.v.players.filter(function (x) { return x.id === pid; })[0];
    return p ? p.handCount : 0;
  }
  /* The cards a play would put down, from your hand. */
  function chosen(state, payload) {

    return (payload.cardIds || []).map(function (id) { return hand.filter(function (c) { return c.id === id; })[0]; }).filter(Boolean);
  }

  /* ---------- the lessons ---------- */

  var LESSONS = [
    {
      title: 'Taking turns',
      hands: [['AS', 'AH', '3C', '8D', 'JC', 'KH'], ['2C', '2S', '6H', '9C', 'QD'], ['3D', '7S', '10H', '5C'], ['4H', '4D', 'JS', '9H', '6S']],
      turn: 'p0', rank: 'A',
      bots: { p1: { plays: [['2C', '2S']] }, p2: { plays: [['3D']] }, p3: { plays: [['4H']] } },
      guard: function (state, type, payload) {
        if (type !== 'play') return null;
        var cards = chosen(state, payload);
        if (cards.some(function (c) { return c.rank !== 'A'; })) return 'Play only your Aces for now. Bluffing comes next.';
        if (cards.length < 2) return 'You have two Aces: pick both, then tap Play.';
        return null;
      },
      steps: [
        { next: true, title: 'Welcome to Bull', text: 'You’re at the table with Mia, Dex and Rae. The aim is to be the first to get rid of all your cards. In a real game the whole deck is dealt out; here everyone has just a few cards, so the lessons are quick.' },
        { next: true, target: 'table', text: 'Turns go clockwise round the table: after you comes Mia, on your left, then Dex, then Rae.' },
        { next: true, target: 'now', text: 'Each turn has a rank: Aces first, then 2s, 3s and so on up to Kings, then round to Aces again. The middle of the table shows the rank that’s next, and who has to play it.' },
        { target: 'mine', text: 'You start, so you play Aces. Tap your two Aces, then tap Play. You can play up to four cards in a turn.', done: played('p0'), after: 400 },
        { next: true, target: 'claim', text: 'Your cards go face down on the pile, and everyone sees what you claimed: two Aces. Nobody else can see whether that’s true.' },
        { watch: true, target: 'table', text: 'Now Mia plays 2s, then Dex plays 3s and Rae plays 4s. Each claim shows in the middle of the table.', done: played('p3'), after: 800 },
        { next: true, target: 'now', text: 'Round it comes to you again, and you’re on 5s. But you don’t have any 5s…' }
      ]
    },
    {
      title: 'Bluffing',
      hands: [['3C', '8D', 'JC', 'KH'], ['6H', '9C', 'QD'], ['7S', '10H', '5C'], ['4D', 'JS', '9H', '6S']],
      pile: [['p0', 'A', ['AS', 'AH']], ['p1', '2', ['2C', '2S']], ['p2', '3', ['3D']], ['p3', '4', ['4H']]],
      last: true, turn: 'p0', rank: '5',
      bots: { p1: { plays: [['6H']] } },
      guard: function (state, type, payload) {
        if (type === 'play' && (payload.cardIds || []).length > 2) return 'Keep some cards back: one or two is plenty for a bluff.';
        return null;

      steps: [
        { target: 'mine', title: 'Bluffing', text: 'Your cards don’t have to be what you claim. You have no 5s, so bluff: pick one card, or two, and play them as 5s.', done: played('p0'), after: 400 },
        { watch: true, target: 'seat:p1', text: 'Will anyone call Bull before Mia plays?', done: played('p1'), after: 700 },
        { next: true, text: 'Nobody called Bull before Mia played, so your bluff worked: those cards are gone for good. Bluff with cards you won’t need for a while. In a real game there’s a time limit too: 30 seconds a turn unless you change it. If it runs out, one card is played for you.' }
      ]
    },
    {
      title: 'Calling Bull',
      hands: [['7S', '7H', '7C', '2D', '10C', 'QS'], ['5H', '9S', 'KD', '3H'], ['7D', 'QC', '4S', '8H', 'JD'], ['8S', '8C', 'AD', '6C']],
      pile: [['p2', '3', ['3S', '3D']], ['p3', '4', ['4C']], ['p0', '5', ['5C', '5S']], ['p1', '6', ['6D']]],
      turn: 'p2', rank: '7',
      bull: true,   // the lesson where you call it
      bots: { p2: { plays: [['7D', 'QC']], think: 1200 } },

  /* bots: { pid: { plays: [[card ids], …] the plays to make, in order (the

     after the Bull moment. callOn: pid whose plays to call Bull on; react: ms } } */
  function scriptedBot(lesson) {
    var script = lesson.bots || {};
    function nextPlay(mine, v) {
      var list = mine.plays || [];
      for (var i = 0; i < list.length; i++) {
        var ids = list[i];
        if (ids.every(function (id) { return v.hand.some(function (c) { return c.id === id; }); })) return ids;
      }
      return null;
    }
    function calls(mine, v) { return !!(v.canBull && v.last && mine.callOn && v.last.by === mine.callOn); }
    return {
      intent: function (v) {
        var mine = script[v.me] || {};
        if (calls(mine, v)) return { key: 'bull:' + v.last.no, kind: 'bull' };
        if (v.canPlay && nextPlay(mine, v)) return { key: 'play:' + v.plays + ':' + v.turn, kind: 'play' };
        return null;
      },
      delay: function (intent, v, rnd, now) {
        var mine = script[v.me] || {};
        if (intent.kind === 'bull') return mine.react || 1500;
        var wait = (v.openAt != null && now != null) ? Math.max(0, v.openAt - now) : 0;
        return wait + (mine.think || 900);
      },
      decide: function (v) {
        var mine = script[v.me] || {};
        if (calls(mine, v)) return { type: 'bull' };
        var ids = v.canPlay ? nextPlay(mine, v) : null;
        return ids ? { type: 'play', payload: { cardIds: ids.slice() } } : null;
      }
    };
  }

  /* The mode with scripted players. In lessons that aren't about calling
     Bull, the Bull! button stays away, and a guard steers your plays back
     on track instead of letting the lesson derail. */
  function modeFor(lesson) {
    var mode = Object.assign({}, Bull, { bot: scriptedBot(lesson) });
    mode.act = function (state, pid, type, payload, now) {
      if (pid === 'p0') {
        if (type === 'bull' && !lesson.bull) return CT.fail('lesson', 'Calling Bull comes in a moment. For now, just watch.');
        var no = lesson.guard && lesson.guard(state, type, payload || {});
        if (no) return CT.fail('lesson', no);
      }
      return Bull.act(state, pid, type, payload, now);
    };
    if (!lesson.bull) {
      mode.view = function (state, pid, opts) {

    }

  }

  /* Lay out the lesson: hands, the pile so far, whose turn and which rank. */
  function rig(state, lesson, now) {
    state.players.forEach(function (p, i) { p.hand = lesson.hands[i].map(C); });
    state.pile = (lesson.pile || []).map(function (pl) { return { by: pl[0], rank: RANKS.indexOf(pl[1]), cards: pl[2].map(C) }; });
    state.plays = state.pile.length;
    state.rank = RANKS.indexOf(lesson.rank);
    state.turn = lesson.turn;
    state.starter = lesson.turn;
    state.phase = 'play';
    state.phaseEndsAt = null;
    state.openAt = now;
    state.turnEndsAt = null;
    state.last = null;
    if (lesson.last && state.pile.length) {

      var top = state.pile[state.pile.length - 1];
      state.last = { by: top.by, rank: top.rank, n: top.cards.length, at: now, no: state.plays };
    }
    state.reveal = null;
    state.winners = null;
    state.events = [];
    state.seq = 0;

    var session = new CT.Session({ mode: modeFor(lesson), players: PLAYERS, options: { turnTime: '30', bullTime: '3', bots: 'normal' }, seed: 11, timing: TIMING });

  Online.prototype.renderLobby = function () {
    var self = this, app = this.app, r = this.room;

    var mode = CT.getMode(r.mode);
    var host = this.isHost();
    var lobby = r.phase === 'lobby';

    var size = r.size;
    var people = r.members;
    var rows = [];
    var me = this.me();
    // who sits where: in the lobby, the first `size` people, then computer players; during a game, the actual seats
    if (lobby) {

      if (m.id === r.host) tags.push('host');
      var state = row.waits ? (lobby ? 'Waits' : 'Next game') : m.computer ? 'Computer covering' : m.connected ? 'Here' : 'Away';
      return '<li class="lobby-seat' + (row.waits ? ' waits' : '') + '"><span class="avatar" style="--paint:' + PAINTS[i % PAINTS.length] + '">' + esc(m.name.charAt(0).toUpperCase()) + '</span>' +

  Online.prototype.share = function () {

      navigator.clipboard.writeText(text).then(done, function () { window.prompt('Copy this link:', text); });

  Online.prototype.confirmLeave = function () {

      '<p class="sheet-text">' + (playing ? 'A computer player takes over your seat for the rest of this game.' : 'You can come back with the code while the room is open.') + '</p>' +

    $('o-stay').addEventListener('click', function () { app.closeSheet(); });
  };

  Online.prototype.leave = function () {
    if (this.conn) {
      var conn = this.conn;

  Online.prototype.leaveTable = function () {

  Online.prototype.endOnline = function () {

  Online.prototype.openMenu = function () {
    var self = this, app = this.app;

    var sheet = app.openSheet('menu', app.sheetHead('Room ' + esc(this.room ? this.room.code : '')) +
      '<div class="menu-list">' +
        '<button class="btn btn-primary" type="button" data-close>' + (over ? 'Back to the table' : 'Keep playing') + '</button>' +
        (over && host ? '<button class="btn btn-ghost" type="button" id="m-again">Play again</button><button class="btn btn-ghost" type="button" id="m-lobby">Back to the room</button>' : '') +
        '<button class="btn btn-ghost" type="button" id="m-rules">How to play</button>' +
        '<button class="btn btn-ghost" type="button" id="m-log">Play-by-play</button>' +
        '<button class="btn btn-ghost" type="button" id="m-invite">Invite friends</button>' +
        '<button class="btn btn-ghost" type="button" id="m-leave">Leave room</button>' +
      '</div>', { label: 'Game menu' });
    app.wireClose(sheet);
    var again = $('m-again'), lobby = $('m-lobby');
    if (again) again.addEventListener('click', function () { app.closeSheet(true); self.conn.send({ t: 'start' }); });
    if (lobby) lobby.addEventListener('click', function () { app.closeSheet(true); self.conn.send({ t: 'lobby' }); });
    $('m-rules').addEventListener('click', function () { app.openRules(app.session.mode.id, app.session.state.options); });
    $('m-log').addEventListener('click', function () { app.openLog(); });
    $('m-invite').addEventListener('click', function () { self.share(); });
    $('m-leave').addEventListener('click', function () { app.closeSheet(true); self.confirmLeave(); });

  /* The buttons under an online result: the host decides what's next. */
  Online.prototype.resultActions = function () {
    if (this.isHost()) {
      return '<button class="btn btn-primary" type="button" id="r-again">Play again</button>' +
        '<button class="btn btn-ghost" type="button" id="r-lobby">Back to the room</button>' +
        '<button class="btn btn-ghost" type="button" id="r-table">See the table</button>' +
        '<button class="btn btn-ghost" type="button" id="r-leave">Leave room</button>';
    }
    return '<p class="result-wait" id="r-wait">Waiting for ' + esc(this.hostName()) + ' to start the next game…</p>' +
      '<button class="btn btn-ghost" type="button" id="r-table">See the table</button>' +
      '<button class="btn btn-ghost" type="button" id="r-leave">Leave room</button>';
  };

  Online.prototype.wireResult = function () {
    var self = this, app = this.app;
    var again = $('r-again'), lobby = $('r-lobby');
    if (again) again.addEventListener('click', function () { again.disabled = true; again.textContent = 'Starting…'; self.conn.send({ t: 'start' }); });
    if (lobby) lobby.addEventListener('click', function () { self.conn.send({ t: 'lobby' }); });

  Online.prototype.refreshResult = function () {

/* ==========================================================================
   APP SHELL — menu, setup, sheets, saving, and the game loop.

(function (CT) {
  'use strict';
  var UI = CT.UI;
  var SAVE_KEY = 'cardtable.save.v1';

  var TUTORIALS_KEY = 'cardtable.tutorials.v1';   // per mode: 'offered' or 'started'
  var BOT_NAMES = ['Mia', 'Dex', 'Rae', 'Kofi', 'Tess', 'Jun', 'Nia', 'Omar', 'Lena', 'Ravi', 'Zoe', 'Ike'];

  function $(id) { return document.getElementById(id); }

  function pickNames(n) {
    var pool = BOT_NAMES.slice();
    for (var i = pool.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = pool[i]; pool[i] = pool[j]; pool[j] = t;

  }

  function clamp(n, lo, hi) { return Math.max(lo, Math.min(hi, n)); }

  /* A mode's decorative fan of three cards (each mode picks its own). */
  function fanHtml(mode) {
    return '<div class="fan" aria-hidden="true" data-cards="' + (mode.fan || ['QS', '9D', 'AH']).join(' ') + '"></div>';
  }
  function fillFans(root) {
    root.querySelectorAll('.fan').forEach(function (fan) {
      fan.dataset.cards.split(' ').forEach(function (id) {
        fan.appendChild(UI.makeCard({ id: id, rank: id.slice(0, -1), suit: id.slice(-1) }));

    settings: {},
    stats: {},
    tutorialLog: {},
    session: null,
    table: null,
    game: null,
    screen: 'home',
    sheet: null,
    logOpen: false,

    boot: function (data) {

      this.migrateSettings();
      this.stats = UI.store.get(STATS_KEY, {}) || {};

      }, true);
      document.addEventListener('visibilitychange', function () { self.onVisibility(); });
      document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && self.sheet && self.sheet !== 'result') self.closeSheet(); });
      $('overlay').addEventListener('click', function (e) { if (e.target === this && self.sheet !== 'confirm' && self.sheet !== 'intro') self.closeSheet(); });
      setInterval(function () { self.loop(); }, 50);
      setInterval(function () { self.save(); }, 2500);

      var hot = window.claude && window.claude.hot;
      if (hot && typeof hot.snapshot === 'function') {

      }

    /* Each mode's rules version, to check an online room runs the same game. */
    engines: function () {

          '<div class="mode-actions"><button class="btn btn-primary" type="button" data-play="' + m.id + '">Play ' + UI.esc(m.shortName || m.name) + '</button>' +
          '<button class="btn btn-ghost" type="button" data-rules="' + m.id + '">How to play</button></div>' +

        '<div class="setup-body">' +
