name: Tests

on:
  push:
  pull_request:

jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Burns rules and simulated games
        run: node test/burns.test.js
      - name: Pass-Roun Donkey rules and simulated games
        run: node test/donkey.test.js
      - name: Bull rules and simulated games
        run: node test/bull.test.js
      - name: Strip-Me rules and simulated games
        run: node test/stripme.test.js
      - name: Stats each game counts, and the leaderboard
        run: node test/stats.test.js && node test/standings.test.js
      - name: Online rooms
        run: node test/online.test.mjs
      - name: Friends on the server
        run: node test/players.test.mjs
      - name: Built app matches the source
        run: |
          node build.js
          git diff --exit-code -- docs || (echo "docs/ is out of date. Run 'node build.js' and commit the result." && exit 1)
