name: Game server

# Deploys the online game server (server/) to Cloudflare whenever it, or the
# game rules it runs, change. Needs two repository secrets:
#   CLOUDFLARE_API_TOKEN   an API token made from the "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID  the Cloudflare account it deploys to
on:
  push:
    branches: [main, online]
    paths:
      - 'server/**'
      - 'src/engine/**'
      - 'src/modes/*/rules.js'
      - 'src/modes/*/bot.js'
      - 'test/online.test.mjs'
      - 'test/players.test.mjs'
      - '.github/workflows/server.yml'
  workflow_dispatch:

concurrency:
  group: game-server
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Room and friends tests
        run: node test/online.test.mjs && node test/players.test.mjs
      - name: Install wrangler
        working-directory: server
        run: npm ci --no-audit --no-fund
      - name: Deploy
        working-directory: server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: |
          set -o pipefail
          npx wrangler deploy 2>&1 | tee deploy.log
      - name: Check the live server
        working-directory: server
        run: |
          URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -1)
          echo "Server: $URL"
          test -n "$URL"
          echo "::notice title=Game server::$URL"
          for i in 1 2 3 4 5 6; do curl -fsS "$URL/" && break; sleep 5; done
          echo
          # rooms restart as the new version rolls out; one retry rides that out, and a real fault fails twice
          check() { node check.mjs "$URL" 2>&1 | tee -a check.log; return "${PIPESTATUS[0]}"; }
          check || { echo "Trying once more in 20 s"; sleep 20; check; } || {
            # say why on the run's summary page, not only in the log
            grep '✗' check.log | while read -r line; do echo "::error title=Live check::$line"; done
            exit 1
          }
